let AC,MG;
function actx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();MG.gain.value=.8;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination)}
  if(AC.state==="suspended")AC.resume();return AC;
}
function tone(f,t0,d,o={}){
  const c=actx();if(!c)return;const{type="sine",g=.2,a=.008,to=null}=o,n=c.currentTime+t0,s=c.createOscillator(),v=c.createGain();
  s.type=type;s.frequency.setValueAtTime(f,n);if(to)s.frequency.exponentialRampToValueAtTime(to,n+d);
  v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+a);v.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(v);v.connect(MG);s.start(n);s.stop(n+d+.03);
}
function hiss(t0,d,o={}){
  const c=actx();if(!c)return;const{f=2000,q=1,g=.1,type="bandpass",to=null}=o,n=c.currentTime+t0,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),da=b.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),v=c.createGain();s.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f,n);if(to)fl.frequency.exponentialRampToValueAtTime(to,n+d);fl.Q.value=q;
  v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(v);v.connect(MG);s.start(n);
}
const LADDER=[523.25,587.33,659.25,783.99,880,1046.5];
const PRI={tick:0,tap:0,flip:0,heart:1,good:1,bad:1,match:1,goal:2,lose:2,win:3,badge:3,level:4},DUR={goal:.8,lose:.8,win:1.5,badge:1.2,level:2};
let sfxPri=0,sfxEnd=0;
function sfx(k,n=1){
  if(S.sound===false)return;
  const now=Date.now(),p=PRI[k]||0;
  if(now<sfxEnd&&p<sfxPri)return; // laufender wichtigerer Klang wird nicht übertönt
  if(DUR[k]){sfxPri=p;sfxEnd=now+DUR[k]*1000}else if(now>=sfxEnd){sfxPri=0}
  try{
    if(k==="tap"){hiss(0,.035,{f:3200,q:.7,g:.05});tone(480,0,.05,{g:.05,type:"triangle"})}
    else if(k==="good"){const f=LADDER[Math.min(n-1,5)];tone(f,0,.45,{g:.2});tone(f*2,0,.25,{g:.05});tone(f*1.26,.09,.5,{g:.18});tone(f*2.52,.09,.25,{g:.04})} // zwei Glockentöne, mit der Serie höher
    else if(k==="bad"){tone(200,0,.28,{type:"triangle",g:.22,to:130});hiss(0,.1,{f:320,q:.6,g:.12,type:"lowpass"})}
    else if(k==="heart"){tone(360,.12,.4,{g:.14,to:170})}
    else if(k==="flip"){hiss(0,.14,{f:1100,to:4200,q:.8,g:.07})}
    else if(k==="match"){tone(880,0,.55,{g:.16});tone(1320,0,.4,{g:.06});tone(1760,.02,.3,{g:.03})}
    else if(k==="tick"){tone(1100,0,.04,{type:"square",g:.035})}
    else if(k==="goal"){[784,988,1175].forEach((f,i)=>tone(f,i*.1,.5,{g:.15}))}
    else if(k==="badge"){tone(880,0,.8,{g:.14});tone(1319,.12,.9,{g:.14});tone(1760,.12,.6,{g:.04})}
    else if(k==="level"){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,i*.09,.5,{type:"triangle",g:.17});tone(f*2,i*.09,.3,{g:.03})});[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.5,1,{g:.07}))}
    else if(k==="win"){[392,494,587,784].forEach((f,i)=>tone(f,i*.13,.5,{type:"triangle",g:.17}));tone(784,.55,.9,{g:.1});tone(988,.55,.9,{g:.08})}
    else if(k==="lose"){[392,330,262].forEach((f,i)=>tone(f,i*.17,.45,{type:"triangle",g:.16}))}
  }catch(e){}
}

let Q={},G={},B={};
function startQuiz(k){
  const L=k==null?null:LES[k],seen=w=>S.box[w.i]!==undefined,now=Date.now();let base,oldIds=new Set();
  if(L){
    const pool=L.w.map(id=>BY[id]),old=oldWords(k),due=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]<=now)),nw=pool.filter(w=>!seen(w)).slice(0,5),rest=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]>now));
    oldIds=new Set(old.map(w=>w.i));
    base=[...old,...due.slice(0,Math.max(0,12-old.length-nw.length)),...nw];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }else{
    const pool=unlockedWords().filter(seen),due=shuffle(pool.filter(w=>S.due[w.i]<=now)),rest=shuffle(pool.filter(w=>S.due[w.i]>now));
    base=[...due.slice(0,10)];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }
  if(!base.length){toast("Hier gibt es gerade nichts zu üben.");return go("path")}
  const news=base.filter(w=>!seen(w)),items=shuffle(base).map(w=>({w,rep:false,old:oldIds.has(w.i)})),b0={};base.forEach(w=>b0[w.i]=S.box[w.i]);
  news.forEach(w=>{const p=items.findIndex(x=>x.w===w&&!x.rep);items.splice(Math.min(items.length,p+3+Math.floor(Math.random()*3)),0,{w,rep:true})}); // neue Wörter kommen später noch einmal
  Q={k,b0,ws:items,intro:news,ii:0,ph:news.length?"intro":"quiz",n:0,right:0,done:0,hearts:3,combo:0,xp:0,wrong:[],fb:null,picked:null,res:null,out:false,fin:false,pct:0,nextLocked:L&&k+1<LES.length?isLocked(k+1):false};

}

  <p style="text-align:center;font-weight:600;margin-top:20px">Neues Wort</p>
  <div class="card flash slide"><div class="ar" lang="ar">${w.ar}</div><p class="mute">(${w.tr})</p><h1>${w.de}</h1>${nt?`<p class="mute">${esc(nt)}</p>`:""}<button class="btn alt" id="sp" style="width:auto;padding:10px 22px">${ic("speaker",18)} Anhören</button></div>
  <button class="btn" id="nx">${Q.ii+1<k?"Weiter":"Abfrage starten"}</button>`);
  $("#sp").onclick=()=>speak(w.ar);if(S.auto!==false)speak(w.ar);

function answer(it,ok){ // Bewertung, XP, Herzen, Rückmeldung
  const w=it.w,dueNow=isDue(w.i);Q.done++;
  if(ok){
    Q.right++;Q.combo++;const x=(it.rep||!dueNow)?5:10+(Q.combo>=3?Math.min(5,Q.combo-2):0);Q.xp+=x; // Üben ohne Fälligkeit gibt weniger XP
    grade(w.i,true);
    Q.fb={ok:true,x,msg:Q.combo>=3?Q.combo+" in Folge":pick(GOOD)};sfx("good",Q.combo);vib(12);addXP(x);
  }else{

}
const GOOD=["Mashallah!","Ausgezeichnet!","Sehr gut!","Stark!","Genau!"],BAD=["Fast!","Nicht ganz.","Kein Problem, weiter!","Das merkst du dir gleich."];

  ${(()=>{const ids=[...new Set(Q.ws.map(x=>x.w.i))],nl=ids.filter(id=>(Q.b0[id]===undefined||Q.b0[id]<2)&&(S.box[id]||0)>=2).length,ns=ids.filter(id=>(Q.b0[id]===undefined||Q.b0[id]===0)&&S.box[id]===1).length;

  $("#again").onclick=()=>startQuiz(Q.k);
}

// ===== Spiel 1: Paare zuordnen =====
function startPairs(){
  const pool=gamePool(6),ws=[];for(const w of shuffle(pool)){if(ws.length<6&&!ws.some(x=>clash(x,w)))ws.push(w)}

}
function finishPairs(){
  clearInterval(gt);G.end=true;G.sec=Math.round((Date.now()-G.t0)/1000);
  G.xp=Math.max(10,30+(G.sec<=20?15:G.sec<=40?8:0)-2*G.miss);
  S.st.pairs=(S.st.pairs||0)+1;addXP(G.xp);if(G.miss<=1)confetti();sfx("win");
}
function pairs(){
  if(G.end){
    paint(`<div style="text-align:center;margin-top:30px"><h1>Geschafft</h1></div>
    <div class="tiles"><div class="card"><p class="mute">Zeit</p><b>${G.sec} s</b></div><div class="card"><p class="mute">Fehler</p><b>${G.miss}</b></div><div class="card" style="grid-column:span 2"><p class="mute">XP verdient</p><b>+${G.xp}</b></div></div>

  }
  const cell=(w,side)=>{const d=G.done.includes(w.i),s=G.sel&&G.sel.id===w.i&&G.sel.side===side,b=G.bad&&G.bad.includes(side+w.i);
    return `<button class="${side==="L"?"ar":""} ${d?"done":s?"sel":""} ${b?"bad":""} ${G.last===w.i?"just":""}" ${side==="L"?'lang="ar"':""} data-p="${side}${w.i}" ${d?"disabled":""}>${side==="L"?w.ar:w.de}</button>`};
  paint(`<div class="top">${xbtn("games")}<h2 style="flex:1">Paare zuordnen</h2><span class="mute" id="pt">${Math.floor((Date.now()-G.t0)/1000)} s</span></div>
  <p class="mute">Tippe ein arabisches Wort und dann die passende Bedeutung. ${G.done.length} / ${G.L.length}</p>
  <div class="pg">${G.L.map((w,k)=>cell(w,"L")+cell(G.R[k],"R")).join("")}</div>`);
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const side=b.dataset.p[0],id=b.dataset.p.slice(1);
    if(!G.sel||G.sel.side===side){G.sel={side,id};G.bad=null;G.last=null;sfx("tap");return pairs()}
    if(G.sel.id===id){G.done.push(id);G.last=id;G.sel=null;G.bad=null;sfx("match");vib(12);speakLater(BY[id].ar);if(G.done.length===G.L.length)finishPairs();return pairs()}
    G.miss++;G.bad=[G.sel.side+G.sel.id,side+id];G.sel=null;G.last=null;sfx("bad");vib([40,30,40]);pairs();
  });
}

// ===== Spiel 2: Wort-Blitz (60 Sekunden) =====
function nextB(){const pool=gamePool(8);B.w=pool[Math.floor(Math.random()*pool.length)];B.opts=options(B.w);B.pick=null;B.locked=false}
const leftB=()=>Math.max(0,60-(Date.now()-B.t0)/1000);
function startBlitz(){

    if(view!=="blitz")return clearInterval(gt);const l=leftB();if(l<=0)return endBlitz();

}
function endBlitz(){

  if(B.xp)addXP(B.xp);else{save();checkBadges()}

function mergeS(a,b){ // pro Wort der bessere Stand, Favoriten vereinigen, pro Tag das Maximum; ein späteres Zurücksetzen gewinnt

  const r=Object.assign({},a);r.box={};r.due={};
  for(const id of new Set([...Object.keys(a.box||{}),...Object.keys(b.box)])){
    const x=(a.box||{})[id],y=b.box[id],useB=x===undefined||(y!==undefined&&(y>x||(y===x&&(b.due[id]||0)>((a.due||{})[id]||0)))),src=useB?b:a;
    r.box[id]=src.box[id];r.due[id]=src.due[id];

}
// Abgleich: Serverstand lesen, mit dem lokalen mischen, nur schreiben wenn der Server seit dem Lesen unverändert ist (sonst nochmal)
async function sync(){
  if(!UID||!sb)return;
  if(busy){again=true;return}
  busy=true;clearTimeout(T);const my=UID;let ok=false,out=false;
  try{
    for(let n=0;n<4&&!ok;n++){
      const{data,error}=await sb.from("progress").select("state,updated_at").eq("user_id",my).maybeSingle();
      if(error)throw error;if(my!==UID){out=true;return}
      if(data&&data.state&&typeof data.state==="object")S=mergeS(S,migrate(clone(data.state)));
      store();ready=true;
      const row={state:S,updated_at:new Date().toISOString()};
      const res=data?await sb.from("progress").update(row).eq("user_id",my).eq("updated_at",data.updated_at).select("user_id")
                    :await sb.from("progress").insert({user_id:my,...row}).select("user_id");
      if(res.error){if(!data)continue;throw res.error}
      if(res.data&&res.data.length)ok=true; // 0 Zeilen: ein anderes Gerät war schneller, also nochmal lesen
    }
    setSY(ok?"Synchronisiert ✓":"Konflikt – wird beim nächsten Mal erneut versucht");
  }catch(e){setSY("Offline – wird später gespeichert")}
  finally{busy=false;lastSync=Date.now();if(again&&!out){again=false;setTimeout(sync,1200)}}
  if(!out&&["home","settings","stats"].includes(view))render();
}
async function flush(){ // vor dem Abmelden: laufenden Abgleich abwarten, dann noch einmal
  clearTimeout(T);const wait=async()=>{for(let i=0;i<40&&busy;i++)await new Promise(r=>setTimeout(r,100))};
  await wait();await sync();await wait();
}
