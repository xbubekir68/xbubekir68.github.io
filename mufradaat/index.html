const SMIN=3;let Z=null;
function startSatz(){
  const open=SENT.filter(sentOpen);
  if(open.length<SMIN){toast("Noch zu wenige Sätze frei. Lerne erst ein paar mehr Wörter.");return go("path")}
  // wenig Geübtes zuerst, bei Gleichstand zufällig
  const pick=open.map(x=>({x,n:(S.sent||{})[x.k]||0,r:Math.random()})).sort((a,b)=>(a.n-b.n)||(a.r-b.r)).slice(0,6).map(o=>o.x);
  Z={items:shuffle(pick).map((x,k)=>({s:x,type:k%2?"bau":"versteh"})),n:0,right:0,xp:0,fb:null,sel:[],opts:null,bank:null,fin:false};
  view="satz";render();
}
function zBank(s){ // Wortblöcke des Satzes plus zwei Ablenker aus anderen freien Sätzen
  const own=new Set(s.t.map(x=>x.a)),extra=shuffle(SENT.filter(sentOpen).filter(o=>o!==s).flatMap(o=>o.t).filter(x=>!own.has(x.a)&&!SFREE.has(x.i)));
  const dis=[];for(const x of extra){if(dis.length<2&&!dis.some(d=>d.a===x.a))dis.push(x)}
  return shuffle([...s.t.map(x=>({...x,own:1})),...dis]).map((x,u)=>({...x,u}));
}
function zOpts(s){ // vier deutsche Übersetzungen, eine richtig
  const others=shuffle(SENT.filter(sentOpen).filter(o=>o!==s&&o.de!==s.de)),sh=others.filter(o=>o.ids.some(i=>s.ids.includes(i)));
  const out=[];for(const o of [...sh,...others]){if(out.length<3&&!out.some(d=>d.de===o.de))out.push(o)}
  return shuffle([s,...out]);
}
function zFinish(ok,x){
  Z.fb={ok,x};if(ok){Z.right++;Z.xp+=x;S.sent=S.sent||{};const it=Z.items[Z.n];S.sent[it.s.k]=(S.sent[it.s.k]||0)+1;sfx("good",Math.min(6,Z.right));vib(12);addXP(x)}else{sfx("bad");vib([40,30,40])}
}

    <div class="card sans"><div class="ar" lang="ar" style="font-size:30px;text-align:center">${sentAr(s)}</div><p class="mute" style="text-align:center;margin-top:4px">${esc(s.tr)}</p><p style="text-align:center;margin-top:4px"><b>${esc(s.de)}</b></p><p style="text-align:center"><button class="lnk" id="hear">${ic("speaker",16)} Anhören</button></p></div>`:"";

  }

function startQuiz(k){

  if(L){
    const pool=L.w.map(id=>BY[id]),old=oldWords(k),due=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]<=now)),nw=pool.filter(w=>!seen(w)).slice(0,5),rest=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]>now));
    oldIds=new Set(old.map(w=>w.i));
    base=[...old,...due.slice(0,Math.max(0,12-old.length-nw.length)),...nw];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }else{
    const pool=unlockedWords().filter(seen),due=shuffle(pool.filter(w=>S.due[w.i]<=now)),rest=shuffle(pool.filter(w=>S.due[w.i]>now));
    base=[...due.slice(0,10)];base.push(...rest.slice(0,Math.max(0,8-base.length)));

}
// Tages-Mischung: fällige Wiederholungen, ein paar neue Wörter und die schwächsten zum Festigen
function mixPlan(){
  const now=Date.now(),seen=w=>S.box[w.i]!==undefined,pool=unlockedWords(),cur=currentLesson();
  const due=pool.filter(w=>seen(w)&&S.due[w.i]<=now).sort((a,b)=>S.due[a.i]-S.due[b.i]).slice(0,8);
  const nw=cur.w.map(id=>BY[id]).filter(w=>!seen(w)).slice(0,3);
  const taken=new Set([...due,...nw].map(w=>w.i));
  const rest=due.length+nw.length?Math.max(0,12-due.length-nw.length):6; // ist nichts fällig, nur eine kurze Festigungsrunde
  // die schwächsten zuerst, bei gleicher Stärke zufällig, damit nicht jeden Tag dieselben kommen
  const cand=pool.filter(w=>seen(w)&&!taken.has(w.i)).map(w=>({w,e:efOf(w.i),b:S.box[w.i]||0,r:Math.random()})).sort((a,b)=>(a.e-b.e)||(a.b-b.b)||(a.r-b.r));
  return{due,nw,weak:cand.slice(0,rest).map(x=>x.w),cur};
}
function mixText(p){ // kurze Beschreibung der Mischung, höchstens zwei Teile

  if(a.length<2&&p.weak.length)a.push(p.weak.length+" zum Festigen");
  return a.join(" · ");
}
function startMix(){

async function sync(){
  if(!UID||!sb)return;
  if(busy){again=true;return}
  busy=true;clearTimeout(T);const my=UID;let ok=false,out=false;
  try{
    for(let n=0;n<4&&!ok;n++){
      const{data,error}=await sb.from("progress").select("state,updated_at").eq("user_id",my).maybeSingle();
      if(error)throw error;if(my!==UID){out=true;return}
      if(data&&data.state&&typeof data.state==="object")S=mergeS(S,migrate(clone(data.state)));
      store();ready=true;
      const row={state:S,updated_at:new Date().toISOString()};
      const res=data?await sb.from("progress").update(row).eq("user_id",my).eq("updated_at",data.updated_at).select("user_id")
                    :await sb.from("progress").insert({user_id:my,...row}).select("user_id");
      if(res.error){if(!data)continue;throw res.error}
      if(res.data&&res.data.length)ok=true; // 0 Zeilen: ein anderes Gerät war schneller, also nochmal lesen
    }
    setSY(ok?"Synchronisiert ✓":"Konflikt – wird beim nächsten Mal erneut versucht");
  }catch(e){setSY("Offline – wird später gespeichert")}
  finally{busy=false;lastSync=Date.now();if(again&&!out){again=false;setTimeout(sync,1200)}}
  if(!out&&["home","settings","stats"].includes(view))render();
}

}

}
async function submit(reg){
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,btn=$('#ok'),er=$('#err'),err=t=>{er.style.color='var(--bad)';er.textContent=t};
  if(!sb)return err('Der Server ist nicht erreichbar. Prüfe deine Verbindung und lade die Seite neu.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err('Bitte gib eine gültige E-Mail-Adresse ein.');
  if(pw.length<8)return err('Das Passwort braucht mindestens 8 Zeichen.');
  if(reg&&pw!==$('#pw2').value)return err('Die Passwörter stimmen nicht überein.');
  btn.disabled=true;err('');
  try{
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){btn.disabled=false;err(msgErr(r.error));if(/not confirmed/i.test(r.error.message||''))offerResend(em,er);return}
    if(!r.data.session){btn.disabled=false;er.style.color='var(--g)';er.textContent='Fast geschafft! Wir haben dir eine E-Mail geschickt. Bestätige sie und melde dich danach an.';offerResend(em,er);return}
    await enter(r.data.session.user);
  }catch(e){btn.disabled=false;err('Verbindung fehlgeschlagen. Bitte versuche es noch einmal.')}
}
async function enter(user){
  U=user.email||'konto';UID=user.id;ready=false;
  try{const n='mfr:'+UID,has=k=>localStorage.getItem(k);
    if(!has(n)){const old=has('mfr:'+U.toLowerCase())||(wasGuest&&has('mfr:gast')); // alten lokalen Fortschritt übernehmen
      if(old)localStorage.setItem(n,old)}}catch(e){}
  wasGuest=false;loadS();view='home';render();sync();
}
async function logout(){
  wasGuest=U==='gast';
  if(UID&&sb){if(ready)await flush();try{await sb.auth.signOut()}catch(e){}}
  try{localStorage.removeItem('mfr_ses');sessionStorage.removeItem('mfr_ses')}catch(e){}
  U=null;UID=null;ready=false;showAuth('start');
}
function showReset(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class='auth'>${SKY}<div class='pane'><h1 style='text-align:center'>Neues Passwort</h1><label for='pw'>Neues Passwort</label><input class='t' id='pw' type='password' autocomplete='new-password' placeholder='Mindestens 8 Zeichen'><p id='err' role='alert' style='color:var(--bad);font-size:14px;min-height:20px;margin-top:10px'></p><button class='btn' id='ok'>Speichern</button></div></div>`;
  $('#ok').onclick=async()=>{const pw=$('#pw').value,er=$('#err');if(pw.length<8)return er.textContent='Das Passwort braucht mindestens 8 Zeichen.';
    const{error}=await sb.auth.updateUser({password:pw});if(error)return er.textContent=msgErr(error);
    const{data}=await sb.auth.getSession();recovering=false;enter(data.session.user)};
}
async function boot(){
  let g=null;try{g=localStorage.getItem('mfr_ses')||sessionStorage.getItem('mfr_ses')}catch(e){}
  if(sb){try{const{data}=await sb.auth.getSession();if(recovering)return;if(data.session)return enter(data.session.user)}catch(e){}}
  if(g==='gast'){U='gast';UID=null;loadS();render()}else showAuth('start');
}
loadSb().then(()=>{initSb();boot()});
if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
</script>
</body>
</html>
