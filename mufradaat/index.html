<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mufradaat – Arabisch lernen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#f6f3ec;--card:#fffdf9;--ink:#1c2a24;--mute:#6b7771;--line:#e6e1d5;--g:#1f6f55;--g2:#2f8f6f;--gl:#dcefe5;--on:#fff;--bad:#c4513f;--badl:#f7dfd9;

:root[data-theme="dark"]{--bg:#111a16;--card:#18241f;--ink:#e8efe9;--mute:#93a39a;--line:#26352e;--g:#3aa57f;--g2:#4fbd95;--gl:#1d3a2f;--on:#0b1511;--bad:#e27a68;--badl:#3a1f1a}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh}
.ar{font-family:var(--ar);direction:rtl}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:20px;margin:0}
p{margin:0}.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{width:100%;border:0;border-radius:999px;background:var(--g);color:var(--on);padding:15px;font-weight:600;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:var(--gl);color:var(--g)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item.main{background:var(--g);color:var(--on);border-color:var(--g)}
.item b{display:block}.item small{opacity:.75;font-size:13px}.item .ic{font-size:22px;width:28px;text-align:center}
.item .ch{margin-left:auto;opacity:.5}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:54px;height:54px;border-radius:50%;background:var(--card)}
.big{font-size:30px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
input[type=search],input.t{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.w{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.w .ar{font-size:24px;min-width:90px;text-align:right}
.w .tr{color:var(--mute);font-size:13px}
.flash{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;margin-top:16px;padding:24px}
.flash .ar{font-size:64px;line-height:1.4}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--g)}
.opt{width:100%;text-align:left;margin-top:10px;padding:15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.opt.ok{border-color:var(--g);background:var(--gl)}.opt.no{border-color:var(--bad);background:var(--badl)}
.opt.ar{text-align:center;font-size:26px}
.kb{direction:rtl;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.kb button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-family:var(--ar);font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tiles .card b{font-size:24px;display:block}
.chart{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:12px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:4px}
.chart i{width:100%;max-width:26px;background:var(--g);border-radius:6px 6px 0 0;min-height:4px}
.set{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);text-align:left}
.grp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 18px}.grp .set:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--g)}.sw.on::after{left:21px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{border:0;background:none;font-size:22px;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{font-size:20px}nav button.on{color:var(--g);font-weight:700}
.hero{text-align:center;padding:40px 10px 10px}.hero .ar{font-size:72px;color:var(--g);line-height:1.3}
nav[hidden]{display:none}
.auth{position:fixed;inset:0;z-index:10;overflow:auto;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#f2cf9f,#ead9bd 36%,#2d7059 80%,#0f3a2c);padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));color:#12332a}
.auth>*{width:100%;max-width:400px;position:relative;z-index:1}
.auth svg{position:absolute;left:0;right:0;bottom:0;width:100%;max-width:none;height:46%;z-index:0}
.hero2{text-align:center;margin-top:8vh}.hero2 .ar{font-size:76px;color:#1f6f55;line-height:1.3}
.acts{margin-top:auto;padding-bottom:20px;color:#fff}.acts a,.auth a{font-weight:600;color:inherit}
.pane{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;margin:auto 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pane label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.pane .row{font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const W=[["kitab","كِتَاب","kitāb","Buch","Alltag"],["madrasah","مَدْرَسَة","madrasah","Schule","Alltag"],["bayt","بَيْت","bayt","Haus","Alltag"],["qalam","قَلَم","qalam","Stift","Alltag"],["bab","بَاب","bāb","Tür","Alltag"],["shams","شَمْس","shams","Sonne","Alltag"],["ma","مَاء","māʼ","Wasser","Essen & Trinken"],["taam","طَعَام","ṭaʿām","Essen","Essen & Trinken"],["khubz","خُبْز","khubz","Brot","Essen & Trinken"],["halib","حَلِيب","ḥalīb","Milch","Essen & Trinken"],["qahwah","قَهْوَة","qahwah","Kaffee","Essen & Trinken"],["sayyarah","سَيَّارَة","sayyārah","Auto","Reisen"],["matar","مَطَار","maṭār","Flughafen","Reisen"],["funduq","فُنْدُق","funduq","Hotel","Reisen"],["tariq","طَرِيق","ṭarīq","Straße","Reisen"],["tadhkarah","تَذْكَرَة","tadhkarah","Fahrkarte","Reisen"],["walad","وَلَد","walad","Junge","Alltag"],["bint","بِنْت","bint","Mädchen","Alltag"],["sadiq","صَدِيق","ṣadīq","Freund","Alltag"],["ailah","عَائِلَة","ʿāʼilah","Familie","Alltag"],["yawm","يَوْم","yawm","Tag","Alltag"],["layl","لَيْل","layl","Nacht","Alltag"],["tuffah","تُفَّاح","tuffāḥ","Apfel","Essen & Trinken"],["aruzz","أَرُزّ","aruzz","Reis","Essen & Trinken"],["shay","شَاي","shāy","Tee","Essen & Trinken"],["lahm","لَحْم","laḥm","Fleisch","Essen & Trinken"],["madinah","مَدِينَة","madīnah","Stadt","Reisen"],["qitar","قِطَار","qiṭār","Zug","Reisen"],["haqibah","حَقِيبَة","ḥaqībah","Koffer","Reisen"],["kharitah","خَرِيطَة","kharīṭah","Landkarte","Reisen"],["wahid","واحد","wāḥid","eins","Zahlen"],["ithnan","اثنان","ithnān","zwei","Zahlen"],["thalathah","ثلاثة","thalāthah","drei","Zahlen"],["arbaah","أربعة","arbaʿah","vier","Zahlen"],["khamsah","خمسة","khamsah","fünf","Zahlen"],["sittah","ستة","sittah","sechs","Zahlen"],["sabah","سبعة","sabʿah","sieben","Zahlen"],["thamaniyah","ثمانية","thamāniyah","acht","Zahlen"],["tisah","تسعة","tisʿah","neun","Zahlen"],["asharah","عشرة","ʿasharah","zehn","Zahlen"],["ahmar","أحمر","aḥmar","rot","Farben"],["azraq","أزرق","azraq","blau","Farben"],["akhdar","أخضر","akhḍar","grün","Farben"],["asfar","أصفر","aṣfar","gelb","Farben"],["abyad","أبيض","abyaḍ","weiß","Farben"],["aswad","أسود","aswad","schwarz","Farben"],["burtuqali","برتقالي","burtuqālī","orange","Farben"],["bunni","بني","bunnī","braun","Farben"],["ras","رأس","raʾs","Kopf","Körper"],["ayn","عين","ʿayn","Auge","Körper"],["yad","يد","yad","Hand","Körper"],["qalb","قلب","qalb","Herz","Körper"],["udhun","أذن","udhun","Ohr","Körper"],["fam","فم","fam","Mund","Körper"],["rijl","رجل","rijl","Fuß","Körper"],["wajh","وجه","wajh","Gesicht","Körper"],["qamar","قمر","qamar","Mond","Natur & Tiere"],["bahr","بحر","baḥr","Meer","Natur & Tiere"],["jabal","جبل","jabal","Berg","Natur & Tiere"],["shajarah","شجرة","shajarah","Baum","Natur & Tiere"],["nahr","نهر","nahr","Fluss","Natur & Tiere"],["kalb","كلب","kalb","Hund","Natur & Tiere"],["qittah","قطة","qiṭṭah","Katze","Natur & Tiere"],["hisan","حصان","ḥiṣān","Pferd","Natur & Tiere"],["tair","طائر","ṭāʾir","Vogel","Natur & Tiere"],["samak","سمك","samak","Fisch","Natur & Tiere"],["dhahaba","ذهب","dhahaba","gehen","Verben"],["akala","أكل","akala","essen","Verben"],["shariba","شرب","shariba","trinken","Verben"],["kataba","كتب","kataba","schreiben","Verben"],["qaraa","قرأ","qaraʾa","lesen","Verben"],["nama","نام","nāma","schlafen","Verben"],["fataha","فتح","fataḥa","öffnen","Verben"],["ahabba","أحب","aḥabba","lieben","Verben"],["amila","عمل","ʿamila","arbeiten","Verben"],["jaa","جاء","jāʾa","kommen","Verben"],["samia","سمع","samiʿa","hören","Verben"],["takallama","تكلم","takallama","sprechen","Verben"],["marhaban","مرحبا","marḥaban","Hallo","Begrüßung"],["shukran","شكرا","shukran","Danke","Begrüßung"],["min-fadlik","من فضلك","min faḍlik","Bitte","Begrüßung"],["naam","نعم","naʿam","Ja","Begrüßung"],["la","لا","lā","Nein","Begrüßung"],["sabah-al-khayr","صباح الخير","ṣabāḥ al-khayr","Guten Morgen","Begrüßung"],["maa-s-salamah","مع السلامة","maʿa s-salāmah","Auf Wiedersehen","Begrüßung"],["asif","آسف","āsif","Entschuldigung","Begrüßung"],["kayfa-haluk","كيف حالك","kayfa ḥāluk","Wie geht es dir?","Begrüßung"],["ismi","اسمي","ismī","Mein Name ist","Begrüßung"],["kabir","كبير","kabīr","groß","Eigenschaften"],["saghir","صغير","ṣaghīr","klein","Eigenschaften"],["jamil","جميل","jamīl","schön","Eigenschaften"],["jadid","جديد","jadīd","neu","Eigenschaften"],["qadim","قديم","qadīm","alt","Eigenschaften"],["sari","سريع","sarīʿ","schnell","Eigenschaften"],["barid","بارد","bārid","kalt","Eigenschaften"],["harr","حار","ḥārr","heiß","Eigenschaften"],["jayyid","جيد","jayyid","gut","Eigenschaften"],["sayyi","سيء","sayyiʾ","schlecht","Eigenschaften"],["said","سعيد","saʿīd","glücklich","Eigenschaften"],["tawil","طويل","ṭawīl","lang","Eigenschaften"]].map(a=>({i:a[0],ar:a[1],tr:a[2],de:a[3],cat:a[4]}));
// Feste IDs: nie ändern! LEGACY = alte Reihenfolge (nur für die Migration alter Speicherstände)
const LEGACY="kitab madrasah bayt qalam bab shams ma taam khubz halib qahwah sayyarah matar funduq tariq tadhkarah walad bint sadiq ailah yawm layl tuffah aruzz shay lahm madinah qitar haqibah kharitah wahid ithnan thalathah arbaah khamsah sittah sabah thamaniyah tisah asharah ahmar azraq akhdar asfar abyad aswad burtuqali bunni ras ayn yad qalb udhun fam rijl wajh qamar bahr jabal shajarah nahr kalb qittah hisan tair samak dhahaba akala shariba kataba qaraa nama fataha ahabba amila jaa samia takallama marhaban shukran min-fadlik naam la sabah-al-khayr maa-s-salamah asif kayfa-haluk ismi kabir saghir jamil jadid qadim sari barid harr jayyid sayyi said tawil".split(" ");
const BY=Object.fromEntries(W.map(w=>[w.i,w]));
const ICON={Alltag:"📖","Essen & Trinken":"🍽️",Reisen:"✈️"};
let S={v:2,days:{},fav:[],dir:"ad",rem:true,time:"19:00",theme:"system",streak:0,last:"",box:{},due:{},seen:[],seenDay:"",notified:""};
const DEF=JSON.stringify(S);let U=null;const SK=()=>"mfr:"+(UID||U);function migrate(st){
  if((st.v||1)<2){ // v1: Fortschritt hing am Array-Index -> auf feste IDs umstellen
    const m=i=>LEGACY[+i],mapObj=o=>{const r={};for(const i in o||{}){const id=m(i);if(id)r[id]=o[i]}return r};
    st.fav=(st.fav||[]).map(m).filter(Boolean);st.box=mapObj(st.box);st.due=mapObj(st.due);delete st.known;
  }
  st.v=2;return st;
}
function loadS(){S=JSON.parse(DEF);try{Object.assign(S,migrate(JSON.parse(localStorage.getItem(SK())||"{}")))}catch(e){}save();applyTheme()}
const save=()=>{try{if(U)localStorage.setItem(SK(),JSON.stringify(S))}catch(e){}sched()};
const $=s=>document.querySelector(s),app=$("#app");
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d},today=()=>ymd(new Date());
const norm=s=>s.replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[\u064B-\u065F\u0670]/g,"").replace(/[أإآ]/g,"ا").replace(/ئ/g,"ي").replace(/ؤ/g,"و").trim();
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function applyTheme(){S.theme==="system"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",S.theme)}
function learned(id){ // richtige Antwort: Serie + Tageszähler (jedes Wort nur 1x pro Tag)
  const d=today();if(S.seenDay!==d){S.seenDay=d;S.seen=[]}
  if(!S.seen.includes(id)){S.seen.push(id);S.days[d]=(S.days[d]||0)+1}
  if(S.last!==d){S.streak=S.last===ymd(ago(1))?S.streak+1:1;S.last=d}
  save();
}
function grade(id,ok){const b=ok?Math.min(4,(S.box[id]||0)+1):0;S.box[id]=b;S.due[id]=Date.now()+[0,1,3,7,14][b]*864e5;if(ok)learned(id);else save()}
const dueN=()=>W.filter(w=>S.box[w.i]!==undefined&&S.due[w.i]<=Date.now()).length;
const isLearned=id=>(S.box[id]||0)>=2,knownN=()=>W.filter(w=>isLearned(w.i)).length,pct=()=>Math.round(knownN()/W.length*100),streak=()=>S.last===today()||S.last===ymd(ago(1))?S.streak:0; // „gelernt“ = ab Box 2
let view="home",ui={cat:"Alle",q:""};
const TABS=[["home","🏠","Start"],["learn","📖","Lernen"],["cards","🗂️","Karteikarten"],["more","⋯","Mehr"]];
function go(v){view=v;render()}
function render(){
  $("#nav").innerHTML=TABS.map(t=>`<button class="${(view===t[0]||(t[0]==="more"&&["stats","fav","settings","list"].includes(view)))?"on":""}" data-go="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");
  $("#nav").hidden=view==="quiz";
  ({home,cards,more,list,stats,settings,quiz,fav})[view]();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){if(g.dataset.go==="learn")return startQuiz();go(g.dataset.go)}});
function head(t,back="home"){return `<div class="top"><button class="x" data-go="${back}" aria-label="Zurück">←</button><h2>${t}</h2></div>`}

function home(){
  const p=pct();
  app.innerHTML=`<div class="hero"><div class="ar">مفردات</div><h1>Mufradaat</h1><p class="mute">Arabisch lernen. Schritt für Schritt.</p></div>
  <h2 style="margin-top:22px">Hallo${U&&U!=="gast"?", "+esc(U.split("@")[0]):""}!</h2><p class="mute">${dueN()} Wörter zur Wiederholung und ${W.filter(w=>S.box[w.i]===undefined).length} neue Wörter warten auf dich.</p>
  <div class="card row" style="margin-top:14px"><div class="ring" style="--p:${p}"></div><div><p class="mute">Lernfortschritt</p><p class="big">${p}%</p><p class="mute">${knownN()} von ${W.length} Wörtern</p></div></div>
  <div class="menu">
  ${[["learn","📖","Lernen","Neue Wörter &amp; Wiederholung","main"],["cards","🗂️","Karteikarten","Lernen im eigenen Tempo",""],["list","🔤","Wortliste","Alle Wörter durchsuchen",""],["stats","📊","Statistiken","Dein Fortschritt im Überblick",""],["fav","⭐","Favoriten","Wichtige Wörter gespeichert",""]].map(m=>`<button class="item ${m[4]}" data-go="${m[0]}"><span class="ic">${m[1]}</span><span><b>${m[2]}</b><small>${m[3]}</small></span><span class="ch">›</span></button>`).join("")}
  </div>`;
}
function more(){
  app.innerHTML=`<h1>Mehr</h1><div class="menu">${[["list","🔤","Wortliste"],["stats","📊","Statistiken"],["fav","⭐","Favoriten"],["settings","⚙️","Einstellungen"]].map(m=>`<button class="item" data-go="${m[0]}"><span class="ic">${m[1]}</span><b>${m[2]}</b><span class="ch">›</span></button>`).join("")}</div>`;
}
function wordRow(w){return `<button class="w" data-say="${w.i}"><span class="ar">${w.ar}</span><span style="flex:1"><b>${w.de}</b><span class="tr"><br>(${w.tr})</span></span><span class="mute">${isLearned(w.i)?"✔ ":""}🔊</span></button>`}
function list(){
  const cats=["Alle",...new Set(W.map(w=>w.cat))];
  const q=ui.q.toLowerCase();
  const ws=W.filter(w=>(ui.cat==="Alle"||w.cat===ui.cat)&&(!q||w.de.toLowerCase().includes(q)||w.tr.toLowerCase().includes(q)||norm(w.ar).includes(norm(q))));
  app.innerHTML=head("Wortliste")+`<input type="search" id="q" placeholder="Wörter suchen …" value="${esc(ui.q)}" aria-label="Wörter suchen"><div class="chips">${cats.map(c=>`<button class="chip ${ui.cat===c?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div><div id="ws">${ws.map(wordRow).join("")||'<p class="mute">Keine Treffer. Versuch einen anderen Suchbegriff.</p>'}</div>`;
  $("#q").oninput=e=>{ui.q=e.target.value;const pos=e.target.selectionStart;list();const el=$("#q");el.focus();el.setSelectionRange(pos,pos)};
}

// Quiz
let Q={};
function startQuiz(){
  const N=10,NEWMAX=5,seen=w=>S.box[w.i]!==undefined;
  const due=shuffle(W.filter(w=>seen(w)&&S.due[w.i]<=Date.now())),nw=shuffle(W.filter(w=>!seen(w))),rest=shuffle(W.filter(w=>seen(w)&&S.due[w.i]>Date.now()));
  const take=due.slice(0,N);take.push(...nw.slice(0,Math.min(NEWMAX,N-take.length)));take.push(...rest.slice(0,N-take.length));
  const ws=shuffle(take),intro=ws.filter(w=>!seen(w));
  Q={ws,intro,ii:0,ph:intro.length?"intro":"quiz",n:0,right:0,picked:null,res:null};view="quiz";render();
}
function intro(){ // neue Wörter erst zeigen, dann abfragen
  const w=Q.intro[Q.ii],k=Q.intro.length;
  app.innerHTML=`<div class="top"><button class="x" data-go="home" aria-label="Beenden">✕</button><div class="bar"><i style="width:${Q.ii/k*100}%"></i></div><span class="mute">Neu ${Q.ii+1} / ${k}</span></div>
  <p style="text-align:center;font-weight:600;margin-top:20px">Neues Wort</p>
  <div class="card flash"><div class="ar" lang="ar">${w.ar}</div><p class="mute">(${w.tr})</p><h1>${w.de}</h1><button class="btn alt" id="sp" style="width:auto;padding:10px 22px">🔊 Anhören</button></div>
  <button class="btn" id="nx">${Q.ii+1<k?"Weiter":"Abfrage starten"}</button>`;
  $("#sp").onclick=()=>speak(w.ar);speak(w.ar);
  $("#nx").onclick=()=>{Q.ii++;if(Q.ii>=k)Q.ph="quiz";quiz()};
}
function quiz(){
  if(Q.ph==="intro")return intro();
  if(Q.n>=Q.ws.length){
    app.innerHTML=head("Geschafft!","home")+`<div class="card" style="text-align:center;margin-top:10px"><div class="big">${Q.right} / ${Q.ws.length}</div><p class="mute">richtig beantwortet</p></div><button class="btn" id="again">Noch eine Runde</button><button class="btn alt" data-go="home">Zur Startseite</button>`;
    $("#again").onclick=startQuiz;return;
  }
  const w=Q.ws[Q.n],bar=`<div class="top"><button class="x" data-go="home" aria-label="Beenden">✕</button><div class="bar"><i style="width:${Q.n/Q.ws.length*100}%"></i></div><span class="mute">${Q.n+1} / ${Q.ws.length}</span></div>`;
  if(S.dir==="ad"){
    if(!Q.opts)Q.opts=shuffle([w,...shuffle(W.filter(x=>x.i!==w.i)).slice(0,3)]);
    app.innerHTML=bar+`<p style="text-align:center;font-weight:600;margin-top:20px">Was bedeutet das Wort?</p><div style="text-align:center;margin:20px 0"><div class="ar" style="font-size:64px">${w.ar}</div><p class="mute">(${w.tr}) <button class="x" id="sp" aria-label="Anhören">🔊</button></p></div>
    ${Q.opts.map(o=>`<button class="opt ${Q.picked!==null?(o.i===w.i?"ok":o.i===Q.picked?"no":""):""}" data-o="${o.i}" ${Q.picked!==null?"disabled":""}>${o.de}</button>`).join("")}
    <button class="btn" id="nx" ${Q.picked===null?"disabled":""}>Weiter</button>`;
    $("#sp").onclick=()=>speak(w.ar);
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{Q.picked=b.dataset.o;const ok=Q.picked===w.i;if(ok)Q.right++;grade(w.i,ok);speak(w.ar);quiz()});
  }else{
    app.innerHTML=bar+`<p style="text-align:center;font-weight:600;margin-top:20px">Schreibe das arabische Wort.</p><div style="text-align:center;margin:16px 0"><span class="chip on" style="font-size:20px;padding:10px 24px">${w.de}</span></div>
    <input class="t ar" id="tx" placeholder="Arabisch schreiben …" autocomplete="off" inputmode="none" style="font-size:24px" ${Q.res!==null?"disabled":""} value="${esc(Q.val||"")}"><div class="kb" id="kb">${[..."ابتثجحخدذرزسشصضطظعغفقكلمنهويءأإآؤئةى"].map(c=>`<button data-k="${c}" ${Q.res!==null?"disabled":""}>${c}</button>`).join("")}<button data-k=" " style="grid-column:span 4;font-family:var(--sans);font-size:14px" ${Q.res!==null?"disabled":""}>Leerzeichen</button><button data-k="⌫" aria-label="Löschen" style="grid-column:span 2;font-family:var(--sans)">⌫</button></div>
    ${Q.res!==null?`<div class="card" style="margin-top:12px;border-width:2px;border-color:${Q.res?"var(--g)":"var(--bad)"}">${Q.res?"Richtig!":"Richtig wäre:"} <span class="ar" style="font-size:24px">${w.ar}</span></div>`:""}
    <button class="btn" id="nx">${Q.res===null?"Überprüfen":"Weiter"}</button>`;
    const tx=$("#tx");tx.oninput=()=>Q.val=tx.value;tx.onkeydown=e=>{if(e.key==="Enter")$("#nx").click()};
    $("#kb").onclick=e=>{const k=e.target.dataset.k;if(!k)return;Q.val=k==="⌫"?(Q.val||"").slice(0,-1):(Q.val||"")+k;tx.value=Q.val;tx.focus()};
  }
  $("#nx").onclick=()=>{
    if(S.dir==="da"&&Q.res===null){Q.res=norm(Q.val||"")===norm(w.ar);if(Q.res)Q.right++;grade(w.i,Q.res);return quiz()}
    Q.n++;Q.opts=null;Q.picked=null;Q.res=null;Q.val="";quiz();
  };
}

function stats(){

  const mx=Math.max(1,...days.map(d=>d[1]));
  app.innerHTML=head("Statistiken")+`<div class="card row"><div><p class="mute">Lernfortschritt</p><p class="big">${pct()}%</p><p class="mute">${knownN()} von ${W.length} Wörtern</p></div><div class="ring" style="--p:${pct()};margin-left:auto"></div></div>
  <div class="tiles"><div class="card"><p class="mute">Heute geübt</p><b>${S.days[today()]||0}</b><span class="mute">Wörter</span></div><div class="card"><p class="mute">Aktuelle Serie</p><b>${streak()}</b><span class="mute">Tage</span></div><div class="card"><p class="mute">Gefestigt</p><b>${Object.values(S.box).filter(b=>b>=3).length}</b><span class="mute">von ${W.length}</span></div><div class="card"><p class="mute">Gelernt gesamt</p><b>${knownN()}</b></div></div>
  <div class="card" style="margin-top:10px"><p><b>Lernverlauf</b></p><div class="chart">${days.map(d=>`<div><i style="height:${d[1]/mx*80}px"></i>${d[0]}</div>`).join("")}</div></div><div class="card" style="margin-top:10px"><p><b>Nach Thema</b></p>${[...new Set(W.map(w=>w.cat))].map(c=>{const t=W.filter(w=>w.cat===c),k=t.filter(w=>isLearned(w.i)).length;return `<div class="row sp" style="margin-top:10px"><span style="width:120px;font-size:14px">${c}</span><div class="bar"><i style="width:${k/t.length*100}%"></i></div><span class="mute">${k}/${t.length}</span></div>`}).join("")}</div>`;
}

let UID=null,T=0,ready=false,SY="",wasGuest=false,recovering=false;

function sched(){if(UID&&sb&&ready){clearTimeout(T);T=setTimeout(push,2000)}}
async function push(){
  if(!UID||!sb||!ready)return;
  try{const{error}=await sb.from("progress").upsert({user_id:UID,state:S,updated_at:new Date().toISOString()});if(error)throw error;setSY("Synchronisiert ✓")}
  catch(e){setSY("Offline – wird später gespeichert")}
}
function mergeS(a,b){ // pro Wort der bessere Stand, Favoriten vereinigen, pro Tag das Maximum
  const r=Object.assign({},a);b.box=b.box||{};b.due=b.due||{};r.box={};r.due={};
  for(const id of new Set([...Object.keys(a.box),...Object.keys(b.box)])){
    const x=a.box[id],y=b.box[id],useB=x===undefined||(y!==undefined&&(y>x||(y===x&&(b.due[id]||0)>(a.due[id]||0)))),src=useB?b:a;
    r.box[id]=src.box[id];r.due[id]=src.due[id];
  }
  r.fav=[...new Set([...(a.fav||[]),...(b.fav||[])])];
  r.days={};for(const k of new Set([...Object.keys(a.days||{}),...Object.keys(b.days||{})]))r.days[k]=Math.max(a.days[k]||0,(b.days||{})[k]||0);
  const al=a.last||"",bl=b.last||"";if(bl>al||(bl===al&&(b.streak||0)>a.streak)){r.streak=b.streak||0;r.last=bl}
  const as=a.seenDay||"",bs=b.seenDay||"";if(bs>as){r.seenDay=bs;r.seen=b.seen||[]}else if(bs===as)r.seen=[...new Set([...(a.seen||[]),...(b.seen||[])])];
  return r;
}
async function pull(){
  if(!UID||!sb)return;const my=UID;SY="Synchronisiere …";
  try{
    const{data,error}=await sb.from("progress").select("state").maybeSingle();if(error)throw error;if(my!==UID)return;
    if(data&&data.state&&typeof data.state==="object")S=mergeS(S,migrate(data.state));
    ready=true;save();clearTimeout(T);await push();
  }catch(e){SY="Offline – wird später gespeichert"}
  if(["home","settings","stats"].includes(view))render();
}

    return}

${reg?`<label for='pw2'>Passwort wiederholen</label><input class='t' id='pw2' type='password' autocomplete='new-password'>`:''}
${reg?'':"<p style='text-align:right;margin-top:10px;font-size:14px'><a href='#' id='fg' style='color:var(--g)'>Passwort vergessen?</a></p>"}<p id='err' role='alert' style='color:var(--bad);font-size:14px;min-height:20px;margin-top:10px'></p>
<button class='btn' id='ok' style='margin-top:6px'>${reg?'Registrieren':'Anmelden'}</button>
<p class='mute' style='text-align:center;margin-top:14px'>${reg?'Schon ein Konto?':'Noch kein Konto?'} <a href='#' id='sw' style='color:var(--g)'>${reg?'Anmelden':'Registrieren'}</a></p>
<p class='mute' style='font-size:12px;text-align:center;margin-top:10px'>Mit einem Konto wird dein Lernfortschritt gespeichert und auf allen Geräten synchronisiert. Wir senden dir nur E-Mails zur Bestätigung und zum Zurücksetzen des Passworts.</p></div></div>`;
  $('#bk').onclick=()=>showAuth('start');

function msgErr(e){
  const m=e.message||"";
  if(/invalid login/i.test(m))return"E-Mail oder Passwort stimmt nicht.";
  if(/already registered/i.test(m))return"Mit dieser E-Mail gibt es schon ein Konto. Bitte melde dich an.";
  if(/not confirmed/i.test(m))return"Bitte bestätige zuerst deine E-Mail-Adresse (Link in der Mail).";
  if(/rate limit|too many/i.test(m))return"Zu viele Versuche. Bitte warte kurz und versuche es erneut.";
  return"Das hat nicht geklappt: "+m;
}
async function submit(reg){
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,btn=$('#ok'),er=$('#err'),err=t=>{er.style.color='var(--bad)';er.textContent=t};
  if(!sb)return err('Der Server ist nicht erreichbar. Prüfe deine Verbindung und lade die Seite neu.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err('Bitte gib eine gültige E-Mail-Adresse ein.');
  if(pw.length<8)return err('Das Passwort braucht mindestens 8 Zeichen.');
  if(reg&&pw!==$('#pw2').value)return err('Die Passwörter stimmen nicht überein.');
  btn.disabled=true;err('');
  try{
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){btn.disabled=false;return err(msgErr(r.error))}
    if(!r.data.session){btn.disabled=false;er.style.color='var(--g)';er.textContent='Fast geschafft! Wir haben dir eine E-Mail geschickt. Bestätige sie und melde dich danach an.';return}

}
