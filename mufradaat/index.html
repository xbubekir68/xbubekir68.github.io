/* Vokale und Tanwin: Zeichen, Silbentafel, Wörter mit Umschrift, Nachsprechen */
.kzn>.ar{font-size:88px;line-height:1.3;color:var(--g)}.kwl{text-align:center;font-size:15px;color:var(--mute);line-height:1.45}.kwl .kgp{color:var(--g);font-weight:700}
.kwr{font-size:56px;line-height:1.7;margin:10px 0 6px}.kgp{color:var(--g)}.kla small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:4px}
.ktf{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:rtl;margin-top:14px}.ktf.few{grid-template-columns:repeat(3,minmax(0,96px));justify-content:center;gap:10px}.ktf.wd{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kts{display:grid;justify-items:center;padding:2px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.kts .ar{font-size:26px;line-height:1.7}.ktf.few .kts .ar{font-size:44px}.ktf.wd .kts .ar{font-size:34px}.ktf.wd .kts small{font-size:13px}.kts small{font-size:11px;color:var(--mute);direction:ltr}.ktu{font-size:13px;line-height:1.5;text-align:center;margin-top:12px}
.ksp{margin-top:14px;display:grid;gap:8px;justify-items:center;text-align:center;padding:16px}.ksp .kgl{margin:4px 0}.ksh{font-size:13px;line-height:1.5}
.ksr{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}.ksr .btn{width:auto;margin:0;padding:10px 18px;display:inline-flex;align-items:center;gap:6px}
.ksr .krec{background:var(--bad);color:var(--on)}.ksk{display:block;margin:10px auto 0}
.ksoon{margin-top:14px}.ksoon ol{list-style:none;margin:10px 0;padding:0;display:grid;gap:10px}.ksoon li{display:flex;gap:12px;align-items:center;opacity:.8}.ksoon li .ar{flex:none;width:96px;text-align:right;font-size:18px;color:var(--mute)}.ksoon li b{display:block;font-size:14px}.ksoon li small{display:block;font-size:12px;color:var(--mute)}
html.splash-lock{overflow:hidden}
/* ===== MUFRADAAT STARTBILDSCHIRM ===== */
@property --spp{syntax:'<percentage>';inherits:false;initial-value:140%}
@property --sps{syntax:'<percentage>';inherits:false;initial-value:160%}

#splash{--bg:#111a16;--track:#26352e;--neon:#3dffb5;position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .55s ease .08s,visibility 0s linear .65s}
#splash::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 46%,rgba(58,165,127,.13),transparent 70%);opacity:0;animation:sp-fadein 1.2s ease .1s forwards}
#splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,6vh,52px);width:100%;margin-top:-4vh;
  transition:transform .7s cubic-bezier(.3,.6,.2,1),filter .55s ease}
#splash.is-leaving .sp-stage{transform:scale(1.07);filter:blur(5px)}

.sp-logo{position:relative;width:min(100%,540px);max-width:100%;aspect-ratio:3.9896/1}
.sp-glow{position:absolute;inset:0;filter:drop-shadow(0 0 0 rgba(61,255,181,0));
  animation:sp-flash .95s ease-out 1.93s forwards,sp-breathe 2.8s ease-in-out 2.93s infinite alternate}
.sp-halo{position:absolute;left:50%;top:50%;width:150%;height:210%;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.8);
  background:radial-gradient(closest-side,rgba(61,255,181,.2),rgba(61,255,181,.07) 55%,transparent 100%);
  animation:sp-bloom 1.2s ease-out 1.68s forwards,sp-halo 3.2s ease-in-out 2.93s infinite alternate}
.sp-ring{position:absolute;left:50%;top:50%;width:58%;height:125%;border-radius:50%;pointer-events:none;opacity:0;
  border:1.5px solid rgba(61,255,181,.6);box-shadow:0 0 14px rgba(61,255,181,.35),inset 0 0 14px rgba(61,255,181,.2);
  transform:translate(-50%,-50%) scale(.3);animation:sp-ring 1.35s cubic-bezier(.15,.6,.3,1) 1.98s forwards}

.ltr{position:absolute;animation:sp-drift .75s cubic-bezier(.2,.7,.2,1) var(--rd) both}
.ltr i{position:absolute;inset:0;background:var(--img) 0 0/100% 100% no-repeat}
.ltr .b{-webkit-mask-image:linear-gradient(98deg,#000 calc(var(--spp) - 10%),transparent calc(var(--spp) + 2%));
  mask-image:linear-gradient(98deg,#000 calc(var(--spp) - 10%),transparent calc(var(--spp) + 2%));
  animation:sp-rv var(--rt) cubic-bezier(.45,.05,.25,1) var(--rd) both}
.ltr .h{filter:brightness(1.8) saturate(1.25);
  -webkit-mask-image:linear-gradient(98deg,transparent calc(var(--spp) - 24%),#000 calc(var(--spp) - 7%),transparent calc(var(--spp) + 1%));
  mask-image:linear-gradient(98deg,transparent calc(var(--spp) - 24%),#000 calc(var(--spp) - 7%),transparent calc(var(--spp) + 1%));
  animation:sp-rv var(--rt) cubic-bezier(.45,.05,.25,1) var(--rd) both}
.ltr .s{filter:brightness(2.5) saturate(.4);
  -webkit-mask-image:linear-gradient(98deg,transparent calc(var(--sps) - 16%),#000 var(--sps),transparent calc(var(--sps) + 16%));
  mask-image:linear-gradient(98deg,transparent calc(var(--sps) - 16%),#000 var(--sps),transparent calc(var(--sps) + 16%));
  animation:sp-sh var(--st) linear var(--sd) both}

.sp-bar{position:relative;width:min(200px,56vw);height:3px;border-radius:2px;background:var(--track);overflow:hidden;opacity:0;animation:sp-fadein .6s ease 1.1s forwards}
.sp-bar::before{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--neon) 60%,#c4ffe9);box-shadow:0 0 10px rgba(61,255,181,.8);
  animation:sp-shuttle 1.5s cubic-bezier(.65,0,.35,1) infinite}

@keyframes sp-rv{from{--spp:-2%}to{--spp:126%}}
@keyframes sp-sh{from{--sps:-16%}to{--sps:116%}}
@keyframes sp-drift{from{transform:translateY(7%)}to{transform:none}}
@keyframes sp-fadein{to{opacity:1}}
@keyframes sp-flash{0%{filter:drop-shadow(0 0 0 rgba(61,255,181,0))}38%{filter:drop-shadow(0 0 30px rgba(61,255,181,.8))}100%{filter:drop-shadow(0 0 14px rgba(61,255,181,.35))}}
@keyframes sp-breathe{from{filter:drop-shadow(0 0 14px rgba(61,255,181,.35))}to{filter:drop-shadow(0 0 26px rgba(61,255,181,.6))}}
@keyframes sp-bloom{to{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
@keyframes sp-halo{from{opacity:.65}to{opacity:1}}
@keyframes sp-ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
@keyframes sp-shuttle{from{transform:translateX(-100%)}to{transform:translateX(263%)}}
@keyframes sp-fb{from{opacity:0;transform:translateY(8%)}to{opacity:1;transform:none}}

/* Fallback ohne @property: Buchstaben blenden nacheinander ein */
#splash.np .ltr{animation:sp-fb .6s ease-out var(--rd) both}
#splash.np .ltr .b{animation:none;-webkit-mask-image:none;mask-image:none}
#splash.np .ltr .h,#splash.np .ltr .s{display:none}

@media (prefers-reduced-motion:reduce){
  #splash::before{animation:none;opacity:1}
  .sp-logo{opacity:1}
  .ltr,.ltr .b,.ltr .h,.ltr .s{animation:none}
  .sp-glow{animation:none;filter:drop-shadow(0 0 16px rgba(61,255,181,.35))}
  .sp-halo{animation:none;opacity:.8;transform:translate(-50%,-50%)}
  .sp-ring{display:none}
  .sp-bar{animation:none;opacity:1}
  .sp-bar::before{animation:none;left:31%;width:38%}
  #splash.is-leaving .sp-stage{transform:none;filter:none}
}

  var MIN=3000,   /* Mindestanzeige in ms, damit die Animation zu Ende laufen kann */
      MAX=10000,  /* Sicherung: blendet spätestens nach so vielen ms aus */
      root=document.documentElement,el,t0,leaving,timer;
  function init(){
    el=document.getElementById('splash');
    if(!el)return;
    leaving=null;t0=performance.now();
    root.classList.add('splash-lock');
    if(!(window.CSS&&CSS.registerProperty))el.classList.add('np');
    clearTimeout(timer);timer=setTimeout(function(){hide({min:0});},MAX);
  }
  function hide(o){
    if(!el)return Promise.resolve();
    if(leaving)return leaving;
    var min=o&&o.min!=null?o.min:MIN,node=el;
    leaving=new Promise(function(done){
      setTimeout(function(){
        node.classList.add('is-leaving');node.setAttribute('aria-hidden','true');
        setTimeout(function(){
          if(node.parentNode)node.parentNode.removeChild(node);
          root.classList.remove('splash-lock');
          document.dispatchEvent(new Event('splash:done'));
          done();
        },750);
      },Math.max(0,min-(performance.now()-t0)));
    });
    return leaving;
  }
  init();
  return{hide:hide,init:init};
})();

</script>

// ===== Klang (synthetisch erzeugt, ohne Audiodateien) =====
let AC,MG;
function actx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();MG.gain.value=.8;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination)}

function tone(f,t0,d,o={}){
  const c=actx();if(!c)return;const{type="sine",g=.2,a=.008,to=null}=o,n=c.currentTime+t0,s=c.createOscillator(),v=c.createGain();
  s.type=type;s.frequency.setValueAtTime(f,n);if(to)s.frequency.exponentialRampToValueAtTime(to,n+d);
  v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+a);v.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(v);v.connect(MG);s.start(n);s.stop(n+d+.03);
}
function hiss(t0,d,o={}){
  const c=actx();if(!c)return;const{f=2000,q=1,g=.1,type="bandpass",to=null}=o,n=c.currentTime+t0,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),da=b.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),v=c.createGain();s.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f,n);if(to)fl.frequency.exponentialRampToValueAtTime(to,n+d);fl.Q.value=q;
  v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(v);v.connect(MG);s.start(n);
}
const LADDER=[523.25,587.33,659.25,783.99,880,1046.5];
const PRI={tick:0,tap:0,flip:0,heart:1,good:1,bad:1,match:1,goal:2,lose:2,win:3,badge:3,level:4},DUR={goal:.8,lose:.8,win:1.5,badge:1.2,level:2};
let sfxPri=0,sfxEnd=0;
function sfx(k,n=1){
  if(S.sound===false)return;
  const now=Date.now(),p=PRI[k]||0;
  if(now<sfxEnd&&p<sfxPri)return; // laufender wichtigerer Klang wird nicht übertönt
  if(DUR[k]){sfxPri=p;sfxEnd=now+DUR[k]*1000}else if(now>=sfxEnd){sfxPri=0}
  try{
    if(k==="tap"){hiss(0,.035,{f:3200,q:.7,g:.05});tone(480,0,.05,{g:.05,type:"triangle"})}
    else if(k==="good"){const f=LADDER[Math.min(n-1,5)];tone(f,0,.45,{g:.2});tone(f*2,0,.25,{g:.05});tone(f*1.26,.09,.5,{g:.18});tone(f*2.52,.09,.25,{g:.04})} // zwei Glockentöne, mit der Serie höher
    else if(k==="bad"){tone(200,0,.28,{type:"triangle",g:.22,to:130});hiss(0,.1,{f:320,q:.6,g:.12,type:"lowpass"})}
    else if(k==="heart"){tone(360,.12,.4,{g:.14,to:170})}
    else if(k==="flip"){hiss(0,.14,{f:1100,to:4200,q:.8,g:.07})}
    else if(k==="match"){tone(880,0,.55,{g:.16});tone(1320,0,.4,{g:.06});tone(1760,.02,.3,{g:.03})}
    else if(k==="tick"){tone(1100,0,.04,{type:"square",g:.035})}
    else if(k==="goal"){[784,988,1175].forEach((f,i)=>tone(f,i*.1,.5,{g:.15}))}
    else if(k==="badge"){tone(880,0,.8,{g:.14});tone(1319,.12,.9,{g:.14});tone(1760,.12,.6,{g:.04})}
    else if(k==="level"){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,i*.09,.5,{type:"triangle",g:.17});tone(f*2,i*.09,.3,{g:.03})});[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.5,1,{g:.07}))}
    else if(k==="win"){[392,494,587,784].forEach((f,i)=>tone(f,i*.13,.5,{type:"triangle",g:.17}));tone(784,.55,.9,{g:.1});tone(988,.55,.9,{g:.08})}
    else if(k==="lose"){[392,330,262].forEach((f,i)=>tone(f,i*.17,.45,{type:"triangle",g:.16}))}
  }catch(e){}
}

const SMIN=3;let Z=null;

(()=>{const su=x=>Math.max(0,...x.ids.filter(i=>!SFREE.has(i)).map(i=>LES[LESOF[i]].u));let pend=[];UNITS.forEach((_,ui)=>{

  pend=[];if(l.length){SSTA[ui]=l;l.forEach(x=>x.st=ui)}
})})();
function startSatz(u){
  const open=SENT.filter(sentOpen);
  if(open.length<SMIN){toast("Noch zu wenige Sätze frei. Lerne erst ein paar mehr Wörter.");return go("path")}
  // wenig Geübtes zuerst, bei Gleichstand zufällig; mit Einheit: zuerst deren Sätze, den Rest füllen andere freie Sätze auf
  const rank=x=>({x,n:(S.sent||{})[x.k]||0,r:Math.random()}),byN=(a,b)=>(a.n-b.n)||(a.r-b.r);
  let pick;

  else pick=open.map(rank).sort(byN).slice(0,6).map(o=>o.x);
  Z={u,back:u!==undefined?"path":"home",items:shuffle(pick).map((x,k)=>({s:x,type:k%2?"bau":"versteh"})),n:0,right:0,xp:0,fb:null,sel:[],opts:null,bank:null,fin:false};

  const dis=[];for(const x of extra){if(dis.length<2&&!dis.some(d=>d.a===x.a))dis.push(x)}

function zOpts(s){ // vier deutsche Übersetzungen, eine richtig

function startQuiz(k){
  const L=k==null?null:LES[k],seen=w=>S.box[w.i]!==undefined,now=Date.now();let base,oldIds=new Set();
  if(L){
    const pool=L.w.map(id=>BY[id]),old=oldWords(k),due=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]<=now)),nw=pool.filter(w=>!seen(w)).slice(0,5),rest=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]>now));
    oldIds=new Set(old.map(w=>w.i));
    base=[...old,...due.slice(0,Math.max(0,12-old.length-nw.length)),...nw];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }else{
    const pool=unlockedWords().filter(seen),due=shuffle(pool.filter(w=>S.due[w.i]<=now)),rest=shuffle(pool.filter(w=>S.due[w.i]>now));
    base=[...due.slice(0,10)];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }
  return runQuiz(base,k,oldIds,null);
}
// Tages-Mischung: fällige Wiederholungen, ein paar neue Wörter und die schwächsten zum Festigen
function mixPlan(){
  const now=Date.now(),seen=w=>S.box[w.i]!==undefined,pool=unlockedWords(),cur=currentLesson();
  const due=pool.filter(w=>seen(w)&&S.due[w.i]<=now).sort((a,b)=>S.due[a.i]-S.due[b.i]).slice(0,8);
  const nw=cur.w.map(id=>BY[id]).filter(w=>!seen(w)).slice(0,3);
  const taken=new Set([...due,...nw].map(w=>w.i));
  const rest=due.length+nw.length?Math.max(0,12-due.length-nw.length):6; // ist nichts fällig, nur eine kurze Festigungsrunde
  // die schwächsten zuerst, bei gleicher Stärke zufällig, damit nicht jeden Tag dieselben kommen
  const cand=pool.filter(w=>seen(w)&&!taken.has(w.i)).map(w=>({w,e:efOf(w.i),b:S.box[w.i]||0,r:Math.random()})).sort((a,b)=>(a.e-b.e)||(a.b-b.b)||(a.r-b.r));
  return{due,nw,weak:cand.slice(0,rest).map(x=>x.w),cur};
}
function mixText(p){ // kurze Beschreibung der Mischung, höchstens zwei Teile
  const a=[];if(p.due.length)a.push(p.due.length+" fällig");if(p.nw.length)a.push(p.nw.length+" neu");
  if(a.length<2&&p.weak.length)a.push(p.weak.length+" zum Festigen");
  return a.join(" · ");
}
function startMix(){
  const p=mixPlan(),base=[...p.due,...p.nw,...p.weak];

}

  const r=Object.assign({},a);r.box={};r.due={};r.ef={};
  for(const id of new Set([...Object.keys(a.box||{}),...Object.keys(b.box)])){
    const x=(a.box||{})[id],y=b.box[id],useB=x===undefined||(y!==undefined&&(y>x||(y===x&&(b.due[id]||0)>((a.due||{})[id]||0)))),src=useB?b:a;
    r.box[id]=src.box[id];r.due[id]=src.due[id];

  }

  const mx=(x,y)=>{const o={};for(const k of new Set([...Object.keys(x||{}),...Object.keys(y||{})]))o[k]=Math.max((x||{})[k]||0,(y||{})[k]||0);return o};
  r.xp=Math.max(a.xp||0,b.xp||0);r.xpDays=mx(a.xpDays,b.xpDays);r.st=mx(a.st,b.st);r.days=mx(a.days,b.days);r.alpha=mx(a.alpha,b.alpha);r.sent=mx(a.sent,b.sent);r.aok=a.aok||b.aok||""; // Buchstaben-Abschnitt: erledigt oder übersprungen gilt überall
  r.badges=[...new Set([...(a.badges||[]),...(b.badges||[])])];
  r.kp={d:mx((a.kp||{}).d,(b.kp||{}).d)}; // neuer Lernpfad: abgeschlossen bleibt abgeschlossen
  const al=a.last||"",bl=b.last||"";if(bl>al||(bl===al&&(b.streak||0)>(a.streak||0))){r.streak=b.streak||0;r.last=bl}

// Abgleich: Serverstand lesen, mit dem lokalen mischen, nur schreiben wenn der Server seit dem Lesen unverändert ist (sonst nochmal)
async function sync(){
  if(!UID||!sb)return;
  if(busy){again=true;return}
  busy=true;clearTimeout(T);const my=UID;let ok=false,out=false;
  try{
    for(let n=0;n<4&&!ok;n++){
      const{data,error}=await sb.from("progress").select("state,updated_at").eq("user_id",my).maybeSingle();
      if(error)throw error;if(my!==UID){out=true;return}
      if(data&&data.state&&typeof data.state==="object")S=mergeS(S,migrate(clone(data.state)));
      store();ready=true;
      const row={state:S,updated_at:new Date().toISOString()};
      const res=data?await sb.from("progress").update(row).eq("user_id",my).eq("updated_at",data.updated_at).select("user_id")
                    :await sb.from("progress").insert({user_id:my,...row}).select("user_id");
      if(res.error){if(!data)continue;throw res.error}
      if(res.data&&res.data.length)ok=true; // 0 Zeilen: ein anderes Gerät war schneller, also nochmal lesen
    }
    setSY(ok?"Synchronisiert ✓":"Noch nicht gespeichert, wird gleich erneut versucht");
  }catch(e){setSY("Offline – wird später gespeichert")}
  finally{busy=false;lastSync=Date.now();if(again&&!out){again=false;setTimeout(sync,1200)}}
  if(!out&&["home","settings","stats"].includes(view))render();
}
async function flush(){ // vor dem Abmelden: laufenden Abgleich abwarten, dann noch einmal
  clearTimeout(T);const wait=async()=>{for(let i=0;i<40&&busy;i++)await new Promise(r=>setTimeout(r,100))};
  await wait();await sync();await wait();
}

  $('#bk').onclick=()=>showAuth('start');$('#lgl').onclick=openLegal;
  $('#tp').onclick=()=>{const sh=$('#pw').type==='password';['#pw','#pw2'].forEach(q=>{const e=$(q);if(e)e.type=sh?'text':'password'});$('#tp').textContent=sh?'Passwort verbergen':'Passwort anzeigen'};
  $('#sw').onclick=e=>{e.preventDefault();showAuth(reg?'login':'register')};
  const fg=$('#fg');if(fg)fg.onclick=async e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),er=$('#err');if(!em||!sb){er.style.color='var(--bad)';return er.textContent='Bitte gib oben deine E-Mail-Adresse ein.'}
    try{await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname})}catch(x){}er.style.color='var(--g)';er.textContent='Falls ein Konto existiert, haben wir dir eine E-Mail zum Zurücksetzen geschickt.'};
  const run=()=>submit(reg);$('#ok').onclick=run;
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')run()});
}
function msgErr(e){
  const m=e.message||"";
  if(/invalid login/i.test(m))return"E-Mail oder Passwort stimmt nicht.";
  if(/already registered/i.test(m))return"Mit dieser E-Mail gibt es schon ein Konto. Bitte melde dich an.";
  if(/not confirmed/i.test(m))return"Bitte bestätige zuerst deine E-Mail-Adresse (Link in der Mail).";
  if(/rate limit|too many/i.test(m))return"Zu viele Versuche. Bitte warte kurz und versuche es erneut.";
  return"Das hat nicht geklappt. Bitte versuche es noch einmal.";
}
async function submit(reg){
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,btn=$('#ok'),er=$('#err'),err=t=>{er.style.color='var(--bad)';er.textContent=t};
  if(!sb)return err('Der Server ist nicht erreichbar. Prüfe deine Verbindung und lade die Seite neu.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err('Bitte gib eine gültige E-Mail-Adresse ein.');
  if(pw.length<8)return err('Das Passwort braucht mindestens 8 Zeichen.');
  if(reg&&pw!==$('#pw2').value)return err('Die Passwörter stimmen nicht überein.');
  btn.disabled=true;err('');
  try{
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){btn.disabled=false;err(msgErr(r.error));if(/not confirmed/i.test(r.error.message||''))offerResend(em,er);return}
    if(!r.data.session){btn.disabled=false;er.style.color='var(--g)';er.textContent='Fast geschafft! Wir haben dir eine E-Mail geschickt. Bestätige sie und melde dich danach an.';offerResend(em,er);return}
    await enter(r.data.session.user);
  }catch(e){btn.disabled=false;err('Verbindung fehlgeschlagen. Bitte versuche es noch einmal.')}
}
async function enter(user){
  U=user.email||'konto';UID=user.id;ready=false;
  try{const n='mfr:'+UID,has=k=>localStorage.getItem(k);
    if(!has(n)){const old=has('mfr:'+U.toLowerCase())||(wasGuest&&has('mfr:gast')); // alten lokalen Fortschritt übernehmen
      if(old)localStorage.setItem(n,old)}}catch(e){}
  wasGuest=false;loadS();view='home';render();sync();
}
async function logout(){
  wasGuest=U==='gast';
  if(UID&&sb){if(ready)await flush();try{await sb.auth.signOut()}catch(e){}}
  try{localStorage.removeItem('mfr_ses');sessionStorage.removeItem('mfr_ses')}catch(e){}
  U=null;UID=null;ready=false;showAuth('start');
}
function showReset(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class='auth'>${SKY}<div class='pane'><h1 style='text-align:center'>Neues Passwort</h1><label for='pw'>Neues Passwort</label><input class='t' id='pw' type='password' autocomplete='new-password' placeholder='Mindestens 8 Zeichen'><p id='err' role='alert' style='color:var(--bad);font-size:14px;min-height:20px;margin-top:10px'></p><button class='btn' id='ok'>Speichern</button></div></div>`;
  $('#ok').onclick=async()=>{const pw=$('#pw').value,er=$('#err');if(pw.length<8)return er.textContent='Das Passwort braucht mindestens 8 Zeichen.';
    const{error}=await sb.auth.updateUser({password:pw});if(error)return er.textContent=msgErr(error);
    const{data}=await sb.auth.getSession();recovering=false;enter(data.session.user)};
}
async function boot(){
  let g=null;try{g=localStorage.getItem('mfr_ses')||sessionStorage.getItem('mfr_ses')}catch(e){}
  if(sb){try{const{data}=await sb.auth.getSession();if(recovering)return;if(data.session)return enter(data.session.user)}catch(e){}}
  if(g==='gast'){U='gast';UID=null;loadS();render()}else showAuth('start');
}
// Startbildschirm ausblenden, sobald Anmeldung geprüft und der erste Bildschirm gezeichnet ist
loadSb().then(()=>{initSb();return boot()}).finally(()=>Splash.hide());
// Neue Version: meldet ein frischer Service Worker eine andere Version als die geladene Seite, bieten wir das Neuladen an (nie automatisch mitten in einer Runde)
// Kein Zoomen per Pinch oder Doppeltipp (iOS ignoriert user-scalable=no teilweise)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
const APPV="mfr-v24"; // muss mit V in sw.js übereinstimmen (prüft tools/test-learning.mjs)
function updBanner(){if($("#upd"))return;const d=document.createElement("div");d.id="upd";d.setAttribute("role","status");d.innerHTML='<span>Neue Version bereit</span><button class="btn" id="updb">Aktualisieren</button>';document.body.appendChild(d);$("#updb").onclick=()=>location.reload()}
if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',()=>{try{navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.v&&e.data.v!==APPV)updBanner()});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}catch(e){}});
</script>
</body>
