<script id="splash-js">
/* ===== MUFRADAAT STARTBILDSCHIRM ===== */
window.Splash=(function(){
  var MIN=2200,   /* Mindestanzeige in ms, damit die Animation einmal ganz läuft */
      MAX=10000,  /* Sicherung: blendet spätestens nach so vielen ms aus */
      root=document.documentElement,el,t0,leaving,timer;
  function init(){
    el=document.getElementById('splash');
    if(!el)return;
    leaving=null;t0=performance.now();
    root.classList.add('splash-lock');
    clearTimeout(timer);timer=setTimeout(function(){hide({min:0});},MAX);
  }
  function hide(o){
    if(!el)return Promise.resolve();
    if(leaving)return leaving;
    var min=o&&o.min!=null?o.min:MIN,node=el;
    leaving=new Promise(function(done){
      setTimeout(function(){
        node.classList.add('is-leaving');node.setAttribute('aria-hidden','true');
        setTimeout(function(){
          if(node.parentNode)node.parentNode.removeChild(node);
          root.classList.remove('splash-lock');
          document.dispatchEvent(new Event('splash:done'));
          done();
        },750);
      },Math.max(0,min-(performance.now()-t0)));
    });
    return leaving;
  }
  init();
  return{hide:hide,init:init};
})();

let AC,MG;
function actx(){

function tone(f,t0,d,o={}){
  const c=actx();if(!c)return;const{type="sine",g=.2,a=.008,to=null}=o,n=c.currentTime+t0,s=c.createOscillator(),v=c.createGain();
  s.type=type;s.frequency.setValueAtTime(f,n);if(to)s.frequency.exponentialRampToValueAtTime(to,n+d);
  v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+a);v.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(v);v.connect(MG);s.start(n);s.stop(n+d+.03);

function hiss(t0,d,o={}){
  const c=actx();if(!c)return;const{f=2000,q=1,g=.1,type="bandpass",to=null}=o,n=c.currentTime+t0,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),da=b.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=Math.random()*2-1;

  v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(v);v.connect(MG);s.start(n);
}
const LADDER=[523.25,587.33,659.25,783.99,880,1046.5];
const PRI={tick:0,tap:0,flip:0,heart:1,good:1,bad:1,match:1,goal:2,lose:2,win:3,badge:3,level:4},DUR={goal:.8,lose:.8,win:1.5,badge:1.2,level:2};
let sfxPri=0,sfxEnd=0;
function sfx(k,n=1){
  if(S.sound===false)return;
  const now=Date.now(),p=PRI[k]||0;
  if(now<sfxEnd&&p<sfxPri)return; // laufender wichtigerer Klang wird nicht übertönt
  if(DUR[k]){sfxPri=p;sfxEnd=now+DUR[k]*1000}else if(now>=sfxEnd){sfxPri=0}
  try{
    if(k==="tap"){hiss(0,.035,{f:3200,q:.7,g:.05});tone(480,0,.05,{g:.05,type:"triangle"})}
    else if(k==="good"){const f=LADDER[Math.min(n-1,5)];tone(f,0,.45,{g:.2});tone(f*2,0,.25,{g:.05});tone(f*1.26,.09,.5,{g:.18});tone(f*2.52,.09,.25,{g:.04})} // zwei Glockentöne, mit der Serie höher
    else if(k==="bad"){tone(200,0,.28,{type:"triangle",g:.22,to:130});hiss(0,.1,{f:320,q:.6,g:.12,type:"lowpass"})}
    else if(k==="heart"){tone(360,.12,.4,{g:.14,to:170})}
    else if(k==="flip"){hiss(0,.14,{f:1100,to:4200,q:.8,g:.07})}
    else if(k==="match"){tone(880,0,.55,{g:.16});tone(1320,0,.4,{g:.06});tone(1760,.02,.3,{g:.03})}
    else if(k==="tick"){tone(1100,0,.04,{type:"square",g:.035})}
    else if(k==="goal"){[784,988,1175].forEach((f,i)=>tone(f,i*.1,.5,{g:.15}))}
    else if(k==="badge"){tone(880,0,.8,{g:.14});tone(1319,.12,.9,{g:.14});tone(1760,.12,.6,{g:.04})}
    else if(k==="level"){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,i*.09,.5,{type:"triangle",g:.17});tone(f*2,i*.09,.3,{g:.03})});[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.5,1,{g:.07}))}
    else if(k==="win"){[392,494,587,784].forEach((f,i)=>tone(f,i*.13,.5,{type:"triangle",g:.17}));tone(784,.55,.9,{g:.1});tone(988,.55,.9,{g:.08})}
    else if(k==="lose"){[392,330,262].forEach((f,i)=>tone(f,i*.17,.45,{type:"triangle",g:.16}))}
  }catch(e){}
}

let Q={},G={},B={};
function startQuiz(k){
  const L=k==null?null:LES[k],seen=w=>S.box[w.i]!==undefined,now=Date.now();let base,oldIds=new Set();
  if(L){
    const pool=L.w.map(id=>BY[id]),old=oldWords(k),due=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]<=now)),nw=pool.filter(w=>!seen(w)).slice(0,5),rest=shuffle(pool.filter(w=>seen(w)&&S.due[w.i]>now));
    oldIds=new Set(old.map(w=>w.i));
    base=[...old,...due.slice(0,Math.max(0,12-old.length-nw.length)),...nw];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }else{
    const pool=unlockedWords().filter(seen),due=shuffle(pool.filter(w=>S.due[w.i]<=now)),rest=shuffle(pool.filter(w=>S.due[w.i]>now));
    base=[...due.slice(0,10)];base.push(...rest.slice(0,Math.max(0,8-base.length)));
  }
  return runQuiz(base,k,oldIds,null);
}
// Tages-Mischung: fällige Wiederholungen, ein paar neue Wörter und die schwächsten zum Festigen
function mixPlan(){
  const now=Date.now(),seen=w=>S.box[w.i]!==undefined,pool=unlockedWords(),cur=currentLesson();
  const due=pool.filter(w=>seen(w)&&S.due[w.i]<=now).sort((a,b)=>S.due[a.i]-S.due[b.i]).slice(0,8);
  const nw=cur.w.map(id=>BY[id]).filter(w=>!seen(w)).slice(0,3);
  const taken=new Set([...due,...nw].map(w=>w.i));
  const rest=due.length+nw.length?Math.max(0,12-due.length-nw.length):6; // ist nichts fällig, nur eine kurze Festigungsrunde
  // die schwächsten zuerst, bei gleicher Stärke zufällig, damit nicht jeden Tag dieselben kommen
  const cand=pool.filter(w=>seen(w)&&!taken.has(w.i)).map(w=>({w,e:efOf(w.i),b:S.box[w.i]||0,r:Math.random()})).sort((a,b)=>(a.e-b.e)||(a.b-b.b)||(a.r-b.r));
  return{due,nw,weak:cand.slice(0,rest).map(x=>x.w),cur};
}
function mixText(p){ // kurze Beschreibung der Mischung, höchstens zwei Teile
  const a=[];if(p.due.length)a.push(p.due.length+" fällig");if(p.nw.length)a.push(p.nw.length+" neu");
  if(a.length<2&&p.weak.length)a.push(p.weak.length+" zum Festigen");
  return a.join(" · ");
}
function startMix(){
  const p=mixPlan(),base=[...p.due,...p.nw,...p.weak];

  const oldIds=new Set(base.filter(w=>LESOF[w.i]!==p.cur.k).map(w=>w.i));

}

// ===== Spiel 4: Buchstaben-Regen (Namen hören, den fallenden Buchstaben fangen) =====
// Fünf Bahnen, in jeder fällt ein Buchstabe. Das Ziel liegt immer mindestens einmal im Feld, ähnliche Buchstaben (gleiche Grundform) kommen öfter dazu.
// Mit jedem Treffer fällt es schneller, ein Fehler kostet 3 Sekunden. Das Feld wird nur einmal gezeichnet, die Buchstaben kommen und gehen einzeln.
let R=null;const RLANES=5,RSEC=60;
const rgPool=()=>{ // im neuen Lernpfad nur Buchstaben aus geschafften S1-Lektionen, mindestens sechs (der Reihe nach aufgefüllt)
  const all=ALPHA.filter(a=>a.i!=="hamza");if(!S.np||S.aok||hasWords()||!KL.length||kS1Done())return all;
  const s1=KL.filter(l=>l.e==="s1"&&(l.neu||[]).length),ids=[...new Set(s1.filter(l=>kDone(l.id)).flatMap(l=>l.neu))];
  for(const l of s1)for(const i of l.neu)if(ids.length<6&&!ids.includes(i))ids.push(i);
  return ids.map(i=>ALBY[i]).filter(a=>a&&a.i!=="hamza");
};
const rLeft=()=>Math.max(0,RSEC-(Date.now()-R.t0)/1000);
function startRegen(){R={intro:true,pool:rgPool()};view="regen";render()}
function rGo(){
  R={pool:R.pool,t0:Date.now(),score:0,combo:0,miss:0,items:[],seq:0,tick:0,end:false,intro:false};
  R.tgt=R.pool[Math.floor(Math.random()*R.pool.length)];regen();
  for(let k=0;k<RLANES;k++)rSpawn(k,true);
  rSay();sfx("tap");
  gt=setInterval(()=>{if(view!=="regen")return clearInterval(gt);rTick()},250);
}
function rLetter(k){ // fehlt das Ziel in den anderen Bahnen, kommt es sicher; sonst oft ein ähnlicher Buchstabe
  if(!R.items.some((x,j)=>j!==k&&x&&x.a===R.tgt))return R.tgt;
  const fam=(AFAM.find(f=>f.includes(R.tgt.i))||[]).map(i=>ALBY[i]).filter(a=>a!==R.tgt&&R.pool.includes(a)),src=fam.length&&Math.random()<.4?fam:R.pool;
  return src[Math.floor(Math.random()*src.length)];
}
function rSpawn(k,first){
  const old=R.items[k];if(old&&old.el&&!old.hit)old.el.remove();
  const a=rLetter(k),it={a,id:++R.seq,dur:Math.max(2.8,6-R.score*.15)+Math.random()*1.2};R.items[k]=it;
  const f=$("#rgf");if(!f||!f.appendChild)return it;
  const b=document.createElement("button");b.type="button";b.className="rgi";b.setAttribute("lang","ar");b.setAttribute("aria-label","Buchstabe "+a.n);b.textContent=a.c;
  b.style.left=(10+k*80/(RLANES-1))+"%"; // feste Bahnen: auch auf schmalen Handys berühren sich die Buchstaben nie
  b.style.animationDuration=it.dur.toFixed(2)+"s";b.style.animationDelay=(first?k*.45+Math.random()*.8:0).toFixed(2)+"s";
  b.onclick=()=>rTap(k,it.id);
  b.onanimationend=e=>{if(e&&e.animationName&&e.animationName!=="rgfall")return;if(!R.end&&R.items[k]===it)rSpawn(k)}; // unten angekommen: neuer Buchstabe in dieser Bahn
  it.el=b;f.appendChild(b);return it;
}
function rSay(){const n=$("#rgn");if(n)n.textContent=R.tgt.n+" · "+R.tgt.s;speak(R.tgt.sp)}
function rTap(k,id){
  if(!R||R.end||R.intro)return;const it=R.items[k];if(!it||it.id!==id||it.hit)return;
  if(it.a===R.tgt){
    R.score++;R.combo++;sfx("good",Math.min(6,R.combo));vib(10);it.hit=true;
    const b=it.el;if(b){try{b.style.transform=getComputedStyle(b).transform}catch(e){}b.style.animationDuration=b.style.animationDelay="";b.classList.add("hit");setTimeout(()=>b.remove(),260)} // an Ort und Stelle aufploppen
    const on=R.items.filter((x,j)=>j!==k&&x.a!==R.tgt).map(x=>x.a),c=on.length?on:R.pool.filter(a=>a!==R.tgt); // neues Ziel: am liebsten etwas, das schon fällt
    R.tgt=c[Math.floor(Math.random()*c.length)];
    rSpawn(k); // fehlt das neue Ziel im Feld, kommt es hier
    const sc=$("#rgc");if(sc)sc.textContent=R.score;rSay();
  }else{
    R.combo=0;R.miss++;R.t0-=3000;sfx("bad");vib([40,30,40]);
    const f=$("#rgf");if(f&&f.classList){f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}
    const b=it.el;if(b){b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400)}
    rTick();
  }
}
function rTick(){
  if(!R||R.end)return;const l=rLeft();if(l<=0)return rEnd();
  const bb=$("#rgb"),bt=$("#rgt"),s=Math.ceil(l);
  if(bb){bb.style.width=l/RSEC*100+"%";bb.parentNode.classList.toggle("low",l<10)}if(bt)bt.textContent=s+" s";
  if(s<=5&&s!==R.tick){R.tick=s;sfx("tick")}
}
function rEnd(){
  clearInterval(gt);R.end=true;const best=S.st.regen||0;R.rec=R.score>best;S.st.regen=Math.max(best,R.score);R.xp=R.score*2;
  if(R.xp)addXP(R.xp);else{save();checkBadges()}

function regen(){
  if(R.intro){
    paint(`<div class="top">${xbtn("games")}<h2 style="flex:1">Buchstaben-Regen</h2></div>
    <div class="card rgin"><p class="ar as4" lang="ar">${R.pool.slice(1,4).map(a=>a.c).join(" ")}</p><p>Du hörst den Namen eines Buchstabens und siehst ihn oben. Tippe den passenden Buchstaben an, bevor er unten ankommt. Mit jedem Treffer wird es schneller.</p>

  }

  paint(`<div class="top">${xbtn("games")}<div class="bar"><i id="rgb" style="width:${l/RSEC*100}%"></i></div><span class="mute" id="rgt">${Math.ceil(l)} s</span></div>
  <div class="rgh"><button class="rgs" id="rgs" aria-label="Nochmal hören">${ic("speaker",20)}<span>Fang: <b id="rgn" aria-live="polite">${R.tgt.n} · ${R.tgt.s}</b></span></button><b class="rgc" id="rgc" aria-label="Treffer">${R.score}</b></div>
  <div class="rgf" id="rgf"></div><p class="mute rgl">Fang den Buchstaben, bevor er landet.</p>`);
  const f=$("#rgf");if(f&&f.style&&f.style.setProperty)f.style.setProperty("--fall",((f.clientHeight||560)+12)+"px");
  $("#rgs").onclick=()=>speak(R.tgt.sp);
}


// ===== Spiel 5: Kalligrafie (Grundform nachfahren, dann die Punkte setzen) =====
// Formen als Bézier-Kurven in einer 320er-Fläche, Grundlinie bei y=196. Bewertet wird, wie nah der Strich an der Form bleibt (Genauigkeit),
// wie viel der Form er abdeckt (Abdeckung) und ob er am richtigen Ende beginnt (Richtung: Arabisch von rechts nach links).
const KBASE=[[[254,118],[256,150],[254,178],[232,190]],[[232,190],[180,194],[130,194],[96,190]],[[96,190],[70,186],[56,170],[60,146]]],
  KDAL=[[[150,112],[170,140],[196,168],[196,186]],[[196,186],[170,196],[140,196],[112,192]]],
  KRA=[[[196,150],[206,192],[186,236],[118,254]]],
  KNUN=[[[228,138],[236,200],[210,246],[160,246]],[[160,246],[110,246],[84,206],[92,150]]];
const KALI=[["ba",KBASE,[[160,240]],"einen Punkt unten"],["ta",KBASE,[[143,150],[177,150]],"zwei Punkte oben"],["tha",KBASE,[[143,154],[177,154],[160,124]],"drei Punkte oben"],
  ["dal",KDAL,[]],["dhal",KDAL,[[150,76]],"einen Punkt oben"],["ra",KRA,[]],["zay",KRA,[[198,112]],"einen Punkt oben"],["nun",KNUN,[[160,168]],"einen Punkt oben"]

let KA=null;

  if(!sb||!UID)return;
  const{error}=await sb.rpc("delete_my_account");
  if(error){toast("Das Konto konnte nicht gelöscht werden. Bitte versuche es später noch einmal.");return}
  const id=UID,mail=String(U||"").toLowerCase();clearTimeout(T);U=null;UID=null;ready=false;
  try{await sb.auth.signOut()}catch(e){}
  try{localStorage.removeItem("mfr:"+id);localStorage.removeItem("mfr:"+mail);localStorage.removeItem("mfr_ses");sessionStorage.removeItem("mfr_ses")}catch(e){}

}
function offerResend(em,er){
  const a=document.createElement("a");a.href="#";a.textContent="Bestätigungs-Mail erneut senden";

const openLegal=e=>{e.preventDefault();view="legal";render()};

// >>> HIER EINTRAGEN: Betreiber, Kontakt und Serverstandort für Datenschutz & Impressum <<<
const LEGAL={name:"Ebubekir Gedik",kontakt:"ebu.gedik@gmx.at",region:"EU (Irland)"}; // z. B. name:"Vorname Nachname, Straße 1, 12345 Ort", kontakt:"mail@beispiel.de", region:"EU (Frankfurt)"
function legal(){
  const miss=t=>t?esc(t):'<b style="color:var(--bad)">noch nicht eingetragen</b>';
  const sec=(t,b)=>`<div class="card" style="margin-top:10px"><p><b>${t}</b></p><div style="margin-top:6px;line-height:1.55;font-size:15px">${b}</div></div>`;
  const topb=U?head("Datenschutz &amp; Impressum","more"):`<div class="top"><button class="x" id="lback" aria-label="Zurück">${ic("back")}</button><h2>Datenschutz &amp; Impressum</h2></div>`;
  paint(topb+
  sec("Wer ist verantwortlich?",`${miss(LEGAL.name)}<br>Kontakt: ${miss(LEGAL.kontakt)}<br>Wohnsitz: Österreich (Salzburg)<br>Art und Richtung: private, nicht kommerzielle Lern-App für arabische Vokabeln, ohne Einnahmen.`)+
  sec("Was gespeichert wird",`<b>Ohne Konto (Gast):</b> Lernstand und Einstellungen liegen nur in deinem Browser (lokaler Speicher) und werden nicht übertragen.<br><b>Mit Konto:</b> deine E-Mail-Adresse, dein Passwort (nur als Hash), dein Lernstand (z. B. Wörter, XP, Serie, Abzeichen), deine Einstellungen und der Zeitpunkt der letzten Änderung.`)+
  sec("Dienstleister",`<b>Supabase</b> (Anmeldung und Datenbank), Serverstandort: ${miss(LEGAL.region)}.<br><b>GitHub Pages</b> liefert diese Seite aus. Beim Aufruf verarbeitet GitHub technisch notwendige Verbindungsdaten wie deine IP-Adresse.<br>Schriften und Programmteile werden von dieser Seite selbst ausgeliefert.`)+
  sec("Aussprache","Die Aussprache kommt meist aus Aufnahmen, die vorab mit einer Sprachsynthese erzeugt wurden. Sie werden mit der App geladen und auf deinem Gerät gespeichert, dabei wird nichts von dir übertragen. Nur wenn eine Aufnahme fehlt, nutzt die App die Sprachausgabe deines Geräts. Manche Browser (z. B. Chrome) greifen dafür auf Online-Dienste des Herstellers zurück, dabei kann das gesprochene Wort übertragen werden.")+
  sec("Mikrofon und Spracherkennung","Beim Nachsprechen nimmst du dich mit dem Mikrofon auf. Die Aufnahme bleibt auf deinem Gerät und wird nicht gespeichert. Ab Etappe 8 kann zusätzlich die Spracherkennung deines Browsers zuhören, aber nur, wenn du vorher zustimmst. Dabei schickt der Browser deine Stimme an den Dienst seines Herstellers (bei Chrome an Google, bei Safari an Apple), der Text daraus kommt zurück und wird nur auf deinem Gerät verglichen. Die App selbst speichert davon nichts.")+
  sec("Cookies und lokaler Speicher","Es gibt keine Werbe- oder Analyse-Cookies und kein Tracking. Der lokale Speicher deines Browsers dient nur der Anmeldung und dem Lernstand und ist dafür technisch notwendig.")+
  sec("Deine Rechte","<b>Auskunft und Export:</b> Einstellungen → „Meine Daten exportieren“.<br><b>Löschung:</b> Einstellungen → „Konto löschen“ entfernt dein Konto und deinen Lernstand dauerhaft.<br>Du kannst außerdem Berichtigung, Einschränkung der Verarbeitung und Widerspruch verlangen und dich bei einer Datenschutz-Aufsichtsbehörde beschweren.")+
  sec("Speicherdauer","Deine Daten bleiben gespeichert, bis du dein Konto löschst.")+
  `<p class="mute" style="margin-top:12px">Stand: November 2026</p>`);
  if(!U)$("#lback").onclick=()=>showAuth("start");
}

const LOGO_N=`<img src='brand/mufradaat-nacht.webp' width='600' height='166' alt='Mufradaat'>`; // Logo auf dunklem Grund (Farbe wie --night)
const WSTEPS=[["ب","as6","Bāʾ · der Buchstabe b"],["بَ","as6","ba · mit kurzem Vokal"],["كِتَابٌ","as6","kitābun · ein Buch"],["بِسْمِ اللَّهِ","as5","bismi llāh · Koranschrift"]];
const wDelay=k=>[.5,3,5.5,8][k]+"s";
const EYE=`<svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg>`;
const wBand=back=>`<section class='wl-band'><span class='wl-c1' aria-hidden='true'></span><span class='wl-c2' aria-hidden='true'></span><div class='wl-hd'>${back?`<button class='wl-bk' id='bk' aria-label='Zurück'><svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M15 6l-6 6 6 6'/></svg></button>`:"<span></span>"}${LOGO_N}</div></section>`;
function showAuth(m){
  $('#nav').hidden=true;
  if(m==='start'){
    app.innerHTML=`<div class='wel'><section class='wl-top'><span class='wl-c1' aria-hidden='true'></span><span class='wl-c2' aria-hidden='true'></span><span class='wl-dot' aria-hidden='true'></span>
      <div class='wl-hd'>${LOGO_N}<button class='wl-lk' id='lgl'>Datenschutz</button></div>
      <div class='wl-st' role='img' aria-label='Von Buchstabe über Silbe und Wort bis zur Koranschrift'>${WSTEPS.map(([ar,c,t],k)=>`<div style='animation-delay:${wDelay(k)}'><span class='ar ${c}' lang='ar'>${ar}</span><small>${t}</small></div>`).join("")}</div>
      <div class='wl-tk' aria-hidden='true'>${["Buchstabe","Silbe","Wort","Koran"].map((t,k)=>`<span style='animation-delay:${wDelay(k)}'>${t}</span>`).join("")}</div></section>
      <div class='wl-tx'><h1>Arabisch<br><span>lesen</span> lernen.</h1><p>Vom ersten Buchstaben bis zur Koranschrift. Danach Wörter und Sätze.</p></div>
      <div class='wl-ac'><button class='wl-go' id='go'>Kostenlos starten<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M5 12h14M13 6l6 6-6 6'/></svg></button>
      <div class='wl-sc'><button id='li'>Anmelden</button><button id='gu'>Ohne Konto testen</button></div></div></div>`;
    $('#go').onclick=()=>showAuth('register');
    $('#li').onclick=e=>{e.preventDefault();showAuth('login')};
    $('#gu').onclick=e=>{e.preventDefault();U='gast';UID=null;try{sessionStorage.setItem('mfr_ses','gast')}catch(x){}loadS();view='home';render()};
    $('#lgl').onclick=openLegal;
    return}
  const reg=m==='register';
  app.innerHTML=`<div class='wel'>${wBand(true)}<div class='wl-pad'><h1>${reg?'Konto erstellen':'Willkommen zurück'}</h1><p class='mute'>${reg?'Speichere deinen Lernfortschritt.':'Melde dich an und lerne dort weiter, wo du warst.'}</p>
<div class='wl-tabs' role='tablist' aria-label='Konto erstellen oder anmelden'><button role='tab' id='treg' aria-selected='${reg}'>Konto erstellen</button><button role='tab' id='tlog' aria-selected='${!reg}'>Anmelden</button></div>
<label for='em'>E-Mail-Adresse</label><input class='t' id='em' type='email' autocomplete='email' inputmode='email' placeholder='name@beispiel.de'>
<label for='pw'>Passwort</label><div class='wl-pw'><input class='t' id='pw' type='password' autocomplete='${reg?'new-password':'current-password'}' placeholder='Mindestens 8 Zeichen'><button type='button' class='wl-eye' id='tp' aria-label='Passwort anzeigen' aria-pressed='false'>${EYE}</button></div>
${reg?`<label for='pw2'>Passwort wiederholen</label><input class='t' id='pw2' type='password' autocomplete='new-password'>`:"<p class='wl-fg'><a href='#' id='fg'>Passwort vergessen?</a></p>"}
<p id='err' role='alert' style='color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0'></p></div>
<div class='wl-ac'><button class='btn' id='ok'>${reg?'Registrieren':'Anmelden'}</button>
<p class='mute wl-note'>Mit einem Konto wird dein Lernfortschritt gespeichert und auf allen Geräten synchronisiert. Wir senden dir nur E-Mails zur Bestätigung und zum Zurücksetzen des Passworts.</p><p class='wl-legal'><a href='#' id='lgl'>Datenschutz &amp; Impressum</a></p></div></div>`;
  $('#bk').onclick=()=>showAuth('start');$('#lgl').onclick=openLegal;
  $('#tp').onclick=()=>{const sh=$('#pw').type==='password';['#pw','#pw2'].forEach(q=>{const e=$(q);if(e)e.type=sh?'text':'password'});$('#tp').setAttribute('aria-pressed',String(sh));$('#tp').setAttribute('aria-label',sh?'Passwort verbergen':'Passwort anzeigen')};
  const sw=to=>()=>{if(to===m)return;const em=$('#em').value;showAuth(to);$('#em').value=em;$(to==='register'?'#treg':'#tlog').focus()}; // E-Mail bleibt beim Wechsel stehen
  $('#treg').onclick=sw('register');$('#tlog').onclick=sw('login');
  const fg=$('#fg');if(fg)fg.onclick=async e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),er=$('#err');if(!em||!sb){er.style.color='var(--bad)';return er.textContent='Bitte gib oben deine E-Mail-Adresse ein.'}
    try{await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname})}catch(x){}er.style.color='var(--g)';er.textContent='Falls ein Konto existiert, haben wir dir eine E-Mail zum Zurücksetzen geschickt.'};
  const run=()=>submit(reg);$('#ok').onclick=run;
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')run()});
}
function msgErr(e){
  const m=e.message||"";
  if(/invalid login/i.test(m))return"E-Mail oder Passwort stimmt nicht.";
  if(/already registered/i.test(m))return"Mit dieser E-Mail gibt es schon ein Konto. Bitte melde dich an.";
  if(/not confirmed/i.test(m))return"Bitte bestätige zuerst deine E-Mail-Adresse (Link in der Mail).";
  if(/rate limit|too many/i.test(m))return"Zu viele Versuche. Bitte warte kurz und versuche es erneut.";
  return"Das hat nicht geklappt. Bitte versuche es noch einmal.";
}
async function submit(reg){
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,btn=$('#ok'),er=$('#err'),err=t=>{er.style.color='var(--bad)';er.textContent=t};
  if(!sb)return err('Der Server ist nicht erreichbar. Prüfe deine Verbindung und lade die Seite neu.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err('Bitte gib eine gültige E-Mail-Adresse ein.');
  if(pw.length<8)return err('Das Passwort braucht mindestens 8 Zeichen.');
  if(reg&&pw!==$('#pw2').value)return err('Die Passwörter stimmen nicht überein.');
  btn.disabled=true;err('');
  try{
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){btn.disabled=false;err(msgErr(r.error));if(/not confirmed/i.test(r.error.message||''))offerResend(em,er);return}
    if(!r.data.session){btn.disabled=false;er.style.color='var(--g)';er.textContent='Fast geschafft! Wir haben dir eine E-Mail geschickt. Bestätige sie und melde dich danach an.';offerResend(em,er);return}
    await enter(r.data.session.user);
  }catch(e){btn.disabled=false;err('Verbindung fehlgeschlagen. Bitte versuche es noch einmal.')}
}
async function enter(user){
  U=user.email||'konto';UID=user.id;ready=false;
  try{const n='mfr:'+UID,has=k=>localStorage.getItem(k);
    if(!has(n)){const old=has('mfr:'+U.toLowerCase())||(wasGuest&&has('mfr:gast')); // alten lokalen Fortschritt übernehmen
      if(old)localStorage.setItem(n,old)}}catch(e){}
  wasGuest=false;loadS();view='home';render();sync();
}
async function logout(){
  wasGuest=U==='gast';
  if(UID&&sb){if(ready)await flush();try{await sb.auth.signOut()}catch(e){}}
  try{localStorage.removeItem('mfr_ses');sessionStorage.removeItem('mfr_ses')}catch(e){}
  U=null;UID=null;ready=false;showAuth('start');
}
function showReset(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class='wel'>${wBand(false)}<div class='wl-pad'><h1>Neues Passwort</h1><p class='mute'>Danach bist du gleich angemeldet.</p><label for='pw'>Neues Passwort</label><input class='t' id='pw' type='password' autocomplete='new-password' placeholder='Mindestens 8 Zeichen'><p id='err' role='alert' style='color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0'></p></div><div class='wl-ac'><button class='btn' id='ok'>Speichern</button></div></div>`;
  $('#ok').onclick=async()=>{const pw=$('#pw').value,er=$('#err');if(pw.length<8)return er.textContent='Das Passwort braucht mindestens 8 Zeichen.';
    const{error}=await sb.auth.updateUser({password:pw});if(error)return er.textContent=msgErr(error);
    const{data}=await sb.auth.getSession();recovering=false;enter(data.session.user)};
}
async function boot(){
  let g=null;try{g=localStorage.getItem('mfr_ses')||sessionStorage.getItem('mfr_ses')}catch(e){}
  if(sb){try{const{data}=await sb.auth.getSession();if(recovering)return;if(data.session)return enter(data.session.user)}catch(e){}}
  if(g==='gast'){U='gast';UID=null;loadS();render()}else showAuth('start');
}
// Startbildschirm ausblenden, sobald Anmeldung geprüft und der erste Bildschirm gezeichnet ist
loadSb().then(()=>{initSb();return boot()}).finally(()=>Splash.hide());
// Neue Version: meldet ein frischer Service Worker eine andere Version als die geladene Seite, bieten wir das Neuladen an (nie automatisch mitten in einer Runde)

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
const APPV="mfr-v51"; // muss mit V in sw.js übereinstimmen (prüft tools/test-learning.mjs)
function updBanner(){if($("#upd"))return;const d=document.createElement("div");d.id="upd";d.setAttribute("role","status");d.innerHTML='<span>Neue Version bereit</span><button class="btn" id="updb">Aktualisieren</button>';document.body.appendChild(d);$("#updb").onclick=()=>location.reload()}
if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',()=>{try{navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.v&&e.data.v!==APPV)updBanner()});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}catch(e){}});
</script>
